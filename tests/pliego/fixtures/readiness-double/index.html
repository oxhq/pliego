<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pliego readiness is terminal</title>
  </head>
  <body>
    <p id="result">waiting</p>
    <script>
      window.pliego.defer();
      addEventListener("load", () => {
        setTimeout(() => {
          document.querySelector("#result").textContent = "first terminal call wins";
          window.pliego.ready({ fixture: "readiness-double", winner: "ready" });
          window.pliego.fail({ code: "TOO_LATE", message: "must be ignored" });
        }, 25);
      }, { once: true });
    </script>
  </body>
</html>
