<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pliego smoke document</title>
    <style>
      body { font: 16px sans-serif; margin: 32px; }
      article { border-left: 4px solid #4b5cff; padding-left: 16px; }
    </style>
  </head>
  <body>
    <article>
      <h1>Pliego is rendering</h1>
      <p id="result">JavaScript has not run.</p>
    </article>
    <script>
      document.querySelector('#result').textContent = 'JavaScript, style, and layout are active.';
      queueMicrotask(() => window.pliego?.ready({ fixture: 'basic' }));
    </script>
  </body>
</html>
