name: Pliego dedicated benchmark host

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Production host proof or a controlled fail-closed check
        required: true
        default: production
        type: choice
        options:
          - production
          - negative-github-hosted
          - negative-missing-thermal
      publication:
        description: Explicit protected authorization for normal replacement or the one-time absent-file bootstrap
        required: true
        default: replace
        type: choice
        options:
          - replace
          - bootstrap

permissions:
  contents: read

concurrency:
  group: Pliego dedicated benchmarks
  cancel-in-progress: false

env:
  CANONICAL_REPOSITORY: oxhq/pliego

jobs:
  dedicated:
    if: inputs.mode != 'negative-github-hosted'
    runs-on:
      group: Pliego dedicated benchmarks
      labels: [self-hosted, Linux, X64, pliego-benchmark-pinned-v1]
    environment: Pliego dedicated benchmarks
    timeout-minutes: 45
    outputs:
      publication_source_artifact_id: ${{ steps.publication_source.outputs.artifact-id }}
      publication_source_artifact_digest: ${{ steps.publication_source.outputs.artifact-digest }}
    steps:
      - name: Initialize setup diagnostics before checkout
        env:
          SETUP_EVIDENCE: ${{ runner.temp }}/pliego-setup-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          umask 0077
          test ! -e "$SETUP_EVIDENCE"
          mkdir -m 0700 "$SETUP_EVIDENCE"
          python3 - "$SETUP_EVIDENCE" <<'PY'
          import datetime, hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          document = {
              "schema": "pliego.benchmark-setup-diagnostic",
              "version": 1,
              "status": "started",
              "phase": "checkout",
              "exit_code": None,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "revision": os.environ["REVISION"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "job": os.environ["GITHUB_JOB"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
          }
          target = root / "benchmark-setup-diagnostic.v1.json"
          temporary = root / ".benchmark-setup-diagnostic.v1.json.tmp"
          with temporary.open("w", encoding="utf-8") as stream:
              stream.write(json.dumps(document, indent=2, sort_keys=True, allow_nan=False) + "\n")
              stream.flush()
              os.fsync(stream.fileno())
          os.replace(temporary, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          manifest = root / "SHA256SUMS"
          temporary_manifest = root / ".SHA256SUMS.tmp"
          with temporary_manifest.open("w", encoding="ascii") as stream:
              stream.write(f"{digest}  {target.name}\n")
              stream.flush()
              os.fsync(stream.fileno())
          os.replace(temporary_manifest, manifest)
          descriptor = os.open(root, os.O_RDONLY | os.O_DIRECTORY)
          try:
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Gate host and produce benchmark evidence
        env:
          MODE: ${{ inputs.mode }}
          SETUP_EVIDENCE: ${{ runner.temp }}/pliego-setup-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          PROOF_DIR: ${{ runner.temp }}/pliego-host-proof-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE: ${{ runner.temp }}/pliego-candidate-${{ github.run_id }}-${{ github.run_attempt }}.json
          FAILURE_EVIDENCE: ${{ runner.temp }}/pliego-failures-${{ github.run_id }}-${{ github.run_attempt }}
          OBSERVER_MEASUREMENTS: ${{ runner.temp }}/pliego-observer-measurements-${{ github.run_id }}-${{ github.run_attempt }}.json
          OBSERVER_PROOF: ${{ runner.temp }}/pliego-observer-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          PLIEGO_BENCHMARK_PROOF_TOKEN: ${{ secrets.OXHQ_BENCHMARK_PROOF_TOKEN }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          SETUP_PHASE=host-contract
          SETUP_FINISHED=0
          record_setup() {
            extra=()
            if [[ $# -ge 3 ]]; then
              extra=(--exit-code "$3")
            fi
            python3 benchmarks/tools/benchmark_setup_evidence.py \
              --output-dir "$SETUP_EVIDENCE" \
              --status "$1" \
              --phase "$2" \
              "${extra[@]}" \
              --repository "$GITHUB_REPOSITORY" \
              --revision "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --job "$GITHUB_JOB" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --runner-os "$RUNNER_OS" \
              --runner-arch "$RUNNER_ARCH"
          }
          trap 'code=$?; if [[ "$SETUP_FINISHED" != 1 ]]; then record_setup failed "$SETUP_PHASE" "$code" || true; fi' EXIT
          record_setup started "$SETUP_PHASE"
          if [[ "$MODE" == "production" ]]; then
            test -n "${PLIEGO_BENCHMARK_CGROUP_PARENT:-}"
            test "$(stat -c '%U:%G:%a' /usr/local/libexec/pliego-cgroup-broker)" = "root:root:555"
            test "$(sha256sum /usr/local/libexec/pliego-cgroup-broker | cut -d' ' -f1)" = \
              "$(sha256sum benchmarks/tools/process_tree_sampler.py | cut -d' ' -f1)"
            engine_gid="$(getent group pliego-benchmark-engine | cut -d: -f3)"
            id -G | tr ' ' '\n' | grep -Fx "$engine_gid"
            test "$(id -u)" != "$(id -u pliego-benchmark-engine)"

            SETUP_PHASE=fixture-generation
            npm --prefix ports/pliego/tests/fixtures/chartjs-report ci
            cp components/fonts/tests/support/dejavu-fonts-ttf-2.37/ttf/DejaVuSans.ttf \
              ports/pliego/tests/fixtures/chartjs-report/ReportSans.ttf
            python3 benchmarks/tools/generate_fixtures.py --check
            SETUP_PHASE=release-resolution
            binary="$(python3 benchmarks/tools/resolve_release.py \
              --cache "$RUNNER_TEMP/pliego-release-cache" \
              --metadata-out "$RUNNER_TEMP/pliego-verified-release.json")"

            SETUP_PHASE=frozen-fixtures
            frozen_root="$RUNNER_TEMP/pliego-frozen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            test ! -e "$frozen_root"
            sudo install -d -o root -g root -m 0555 \
              "$frozen_root/benchmarks" \
              "$frozen_root/ports/pliego/tests/fixtures"
            sudo cp -a benchmarks/fixtures "$frozen_root/benchmarks/"
            sudo cp -a ports/pliego/tests/fixtures/chartjs-report \
              "$frozen_root/ports/pliego/tests/fixtures/"
            sudo chown -R root:root "$frozen_root"
            sudo find "$frozen_root" -type d -exec chmod 0555 {} +
            sudo find "$frozen_root" -type f -exec chmod 0444 {} +

            SETUP_PHASE=host-preflight
            python3 benchmarks/tools/benchmark_host_preflight.py \
              --mode production \
              --output-dir "$PROOF_DIR" \
              --config "${PLIEGO_BENCHMARK_HOST_CONFIG:-/etc/pliego-benchmark-host.v1.json}" \
              -- python3 benchmarks/tools/run_benchmark.py \
                --binary "$binary" \
                --frozen-fixture-root "$frozen_root" \
                --staging-out "$CANDIDATE" \
                --failure-evidence-dir "$FAILURE_EVIDENCE/run" \
                --observer-measurements-out "$OBSERVER_MEASUREMENTS"

            SETUP_PHASE=observer-proof
            python3 benchmarks/tools/observer_ab.py bind \
              --measurements "$OBSERVER_MEASUREMENTS" \
              --host-proof "$PROOF_DIR/benchmark-host-proof.v1.json" \
              --out "$OBSERVER_PROOF"
            python3 benchmarks/tools/observer_ab.py validate \
              "$OBSERVER_PROOF" \
              --host-proof "$PROOF_DIR/benchmark-host-proof.v1.json"

            SETUP_PHASE=benchmark-evidence-ready
            record_setup passed "$SETUP_PHASE" 0
            SETUP_FINISHED=1
            exit 0
          fi

          set +e
          python3 benchmarks/tools/benchmark_host_preflight.py \
            --mode "$MODE" \
            --output-dir "$PROOF_DIR" \
            --config "${PLIEGO_BENCHMARK_HOST_CONFIG:-/etc/pliego-benchmark-host.v1.json}" \
            -- python3 benchmarks/tools/test_process_tree_sampler.py --acceptance-overhead
          status=$?
          set -e
          test "$status" -ne 0
          python3 benchmarks/tools/validate_host_proof.py \
            "$PROOF_DIR/benchmark-host-proof.v1.json" \
            --expect-status rejected \
            --forbid-event samples.started
          SETUP_PHASE=negative-gate-complete
          record_setup passed "$SETUP_PHASE" 0
          SETUP_FINISHED=1

      - name: Authenticate benchmark publication subject
        if: success() && inputs.mode == 'production'
        env:
          SETUP_EVIDENCE: ${{ runner.temp }}/pliego-setup-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          PROOF_DIR: ${{ runner.temp }}/pliego-host-proof-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE: ${{ runner.temp }}/pliego-candidate-${{ github.run_id }}-${{ github.run_attempt }}.json
          OBSERVER_PROOF: ${{ runner.temp }}/pliego-observer-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          ATTESTATION_STAGING: ${{ runner.temp }}/${{ github.run_id }}-${{ github.run_attempt }}.json
          ATTESTATION: /var/lib/pliego-benchmark-attestations/${{ github.run_id }}-${{ github.run_attempt }}.json
          PUBLISHED_BASELINE: benchmarks/baselines/pliego-0.1.1-linux-x86_64.json
          PUBLICATION_OPERATION: ${{ inputs.publication }}
          PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX: ${{ secrets.PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          SETUP_FINISHED=0
          record_setup() {
            extra=()
            if [[ $# -ge 3 ]]; then
              extra=(--exit-code "$3")
            fi
            python3 benchmarks/tools/benchmark_setup_evidence.py \
              --output-dir "$SETUP_EVIDENCE" \
              --status "$1" \
              --phase "$2" \
              "${extra[@]}" \
              --repository "$GITHUB_REPOSITORY" \
              --revision "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --job "$GITHUB_JOB" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --runner-os "$RUNNER_OS" \
              --runner-arch "$RUNNER_ARCH"
          }
          trap 'code=$?; unset PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX; if [[ "$SETUP_FINISHED" != 1 ]]; then record_setup failed protected-attestation "$code" || true; fi' EXIT
          test -n "$PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX"
          test ! -e "$ATTESTATION_STAGING"
          python3 benchmarks/tools/create_publication_attestation.py \
            --candidate "$CANDIDATE" \
            --host-proof "$PROOF_DIR/benchmark-host-proof.v1.json" \
            --observer-proof "$OBSERVER_PROOF" \
            --output-basename "${PUBLISHED_BASELINE##*/}" \
            --operation "$PUBLICATION_OPERATION" \
            --out "$ATTESTATION_STAGING"
          unset PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX
          sudo install -d -o root -g root -m 0755 "$(dirname "$ATTESTATION")"
          test ! -e "$ATTESTATION"
          sudo install -o root -g root -m 0444 "$ATTESTATION_STAGING" "$ATTESTATION"
          rm "$ATTESTATION_STAGING"
          record_setup passed protected-attestation 0
          SETUP_FINISHED=1

      - name: Publish authenticated benchmark baseline
        if: success() && inputs.mode == 'production'
        env:
          SETUP_EVIDENCE: ${{ runner.temp }}/pliego-setup-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          PROOF_DIR: ${{ runner.temp }}/pliego-host-proof-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE: ${{ runner.temp }}/pliego-candidate-${{ github.run_id }}-${{ github.run_attempt }}.json
          FAILURE_EVIDENCE: ${{ runner.temp }}/pliego-failures-${{ github.run_id }}-${{ github.run_attempt }}
          OBSERVER_PROOF: ${{ runner.temp }}/pliego-observer-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          ATTESTATION: /var/lib/pliego-benchmark-attestations/${{ github.run_id }}-${{ github.run_attempt }}.json
          PUBLISHED_BASELINE: benchmarks/baselines/pliego-0.1.1-linux-x86_64.json
          PUBLICATION_OPERATION: ${{ inputs.publication }}
          PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX: ${{ secrets.PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          SETUP_FINISHED=0
          record_setup() {
            extra=()
            if [[ $# -ge 3 ]]; then
              extra=(--exit-code "$3")
            fi
            python3 benchmarks/tools/benchmark_setup_evidence.py \
              --output-dir "$SETUP_EVIDENCE" \
              --status "$1" \
              --phase "$2" \
              "${extra[@]}" \
              --repository "$GITHUB_REPOSITORY" \
              --revision "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --job "$GITHUB_JOB" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --runner-os "$RUNNER_OS" \
              --runner-arch "$RUNNER_ARCH"
          }
          trap 'code=$?; unset PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX; if [[ "$SETUP_FINISHED" != 1 ]]; then record_setup failed publication "$code" || true; fi' EXIT
          test -n "$PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX"
          python3 benchmarks/tools/publish_benchmark.py \
            --candidate "$CANDIDATE" \
            --host-proof "$PROOF_DIR/benchmark-host-proof.v1.json" \
            --observer-proof "$OBSERVER_PROOF" \
            --attestation "$ATTESTATION" \
            --out "$PUBLISHED_BASELINE" \
            --operation "$PUBLICATION_OPERATION" \
            --failure-evidence "$FAILURE_EVIDENCE/publish"
          unset PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX
          record_setup passed publication-complete 0
          SETUP_FINISHED=1

      - name: Stage exact publication source artifact
        if: success() && inputs.mode == 'production'
        env:
          PROOF_DIR: ${{ runner.temp }}/pliego-host-proof-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE: ${{ runner.temp }}/pliego-candidate-${{ github.run_id }}-${{ github.run_attempt }}.json
          OBSERVER_PROOF: ${{ runner.temp }}/pliego-observer-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          ATTESTATION: /var/lib/pliego-benchmark-attestations/${{ github.run_id }}-${{ github.run_attempt }}.json
          PUBLISHED_BASELINE: benchmarks/baselines/pliego-0.1.1-linux-x86_64.json
          PUBLICATION_SOURCE: ${{ runner.temp }}/pliego-publication-source-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test -z "${PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX:-}"
          python3 benchmarks/tools/publication_promotion.py stage \
            --repository "$GITHUB_REPOSITORY" \
            --repository-root "$GITHUB_WORKSPACE" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --operation "${{ inputs.publication }}" \
            --output-basename "${PUBLISHED_BASELINE##*/}" \
            --candidate "$CANDIDATE" \
            --host-proof-dir "$PROOF_DIR" \
            --observer-proof "$OBSERVER_PROOF" \
            --attestation "$ATTESTATION" \
            --baseline "$PUBLISHED_BASELINE" \
            --out "$PUBLICATION_SOURCE"

      - name: Remove frozen fixture mirror
        if: always() && inputs.mode == 'production'
        env:
          FROZEN_ROOT: ${{ runner.temp }}/pliego-frozen-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          case "$FROZEN_ROOT" in
            "$RUNNER_TEMP"/pliego-frozen-*)
              if [[ -e "$FROZEN_ROOT" ]]; then
                sudo rm -rf --one-file-system -- "$FROZEN_ROOT"
              fi
              ;;
            *) echo "refusing unsafe frozen-fixture cleanup: $FROZEN_ROOT" >&2; exit 1 ;;
          esac

      - name: Seal retained failure evidence
        if: always() && inputs.mode == 'production'
        env:
          FAILURE_EVIDENCE: ${{ runner.temp }}/pliego-failures-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ -d "$FAILURE_EVIDENCE" ]]; then
            sudo chown -R root:root "$FAILURE_EVIDENCE"
            sudo find "$FAILURE_EVIDENCE" -type d -exec chmod 0555 {} +
            sudo find "$FAILURE_EVIDENCE" -type f -exec chmod 0444 {} +
          fi

      - name: Retain host proof and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-host-proof-${{ inputs.mode }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pliego-host-proof-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/pliego-failures-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/pliego-observer-measurements-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/pliego-setup-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30

      - name: Retain exact publication source
        id: publication_source
        if: success() && inputs.mode == 'production'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-publication-source-${{ github.sha }}-${{ inputs.publication }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pliego-publication-source-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  verify-publication:
    name: Revalidate exact publication artifact
    needs: dedicated
    if: inputs.mode == 'production' && needs.dedicated.result == 'success'
    runs-on: ubuntu-24.04
    environment: Pliego dedicated benchmarks
    timeout-minutes: 10
    outputs:
      verified_baseline_artifact_id: ${{ steps.verified_baseline.outputs.artifact-id }}
      verified_baseline_artifact_digest: ${{ steps.verified_baseline.outputs.artifact-digest }}
    permissions:
      actions: read
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind source artifact ID, digest, and run identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.dedicated.outputs.publication_source_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.dedicated.outputs.publication_source_artifact_digest }}
          EXPECTED_NAME: benchmark-publication-source-${{ github.sha }}-${{ inputs.publication }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test "$DEFAULT_BRANCH" = main
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/$CANONICAL_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg name "$EXPECTED_NAME" \
            --arg digest "sha256:$ARTIFACT_DIGEST" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg revision "$GITHUB_SHA" \
            --arg branch "$DEFAULT_BRANCH" '
              .id == $artifact_id
              and .name == $name
              and .expired == false
              and .digest == $digest
              and .workflow_run.id == $run_id
              and .workflow_run.head_sha == $revision
              and .workflow_run.head_branch == $branch
            ' <<< "$artifact" >/dev/null

      - name: Download only this run attempt publication source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.dedicated.outputs.publication_source_artifact_id }}
          path: ${{ runner.temp }}/publication-source
          merge-multiple: true

      - name: Revalidate HMAC-bound publication source
        env:
          SOURCE: ${{ runner.temp }}/publication-source
          VERIFIED: ${{ runner.temp }}/verified-benchmark-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX: ${{ secrets.PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          trap 'unset PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX' EXIT
          test -n "$PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX"
          python3 benchmarks/tools/publication_promotion.py verify \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --operation "${{ inputs.publication }}" \
            --output-basename pliego-0.1.1-linux-x86_64.json \
            --bundle "$SOURCE" \
            --out "$VERIFIED"
          unset PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX
          trap - EXIT

      - name: Retain newly verified baseline only
        id: verified_baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-benchmark-baseline-${{ github.sha }}-${{ inputs.publication }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-benchmark-baseline-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  promote-publication:
    name: Open exact baseline promotion PR
    needs: verify-publication
    if: inputs.mode == 'production' && needs.verify-publication.result == 'success'
    runs-on: ubuntu-24.04
    environment: Pliego benchmark promotion
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind verified artifact ID, digest, and run identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.verify-publication.outputs.verified_baseline_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.verify-publication.outputs.verified_baseline_artifact_digest }}
          EXPECTED_NAME: verified-benchmark-baseline-${{ github.sha }}-${{ inputs.publication }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test "$DEFAULT_BRANCH" = main
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/$CANONICAL_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          jq -e \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg name "$EXPECTED_NAME" \
            --arg digest "sha256:$ARTIFACT_DIGEST" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg revision "$GITHUB_SHA" \
            --arg branch "$DEFAULT_BRANCH" '
              .id == $artifact_id
              and .name == $name
              and .expired == false
              and .digest == $digest
              and .workflow_run.id == $run_id
              and .workflow_run.head_sha == $revision
              and .workflow_run.head_branch == $branch
            ' <<< "$artifact" >/dev/null

      - name: Download only this run attempt verified baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify-publication.outputs.verified_baseline_artifact_id }}
          path: ${{ runner.temp }}/verified-baseline
          merge-multiple: true

      - name: Prepare exact old-blob-bound baseline change
        env:
          VERIFIED: ${{ runner.temp }}/verified-baseline
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test -z "${PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX:-}"
          python3 benchmarks/tools/publication_promotion.py prepare \
            --repository "$GITHUB_REPOSITORY" \
            --repository-root "$GITHUB_WORKSPACE" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --operation "${{ inputs.publication }}" \
            --output-basename pliego-0.1.1-linux-x86_64.json \
            --bundle "$VERIFIED"

      - name: Create or reuse review-only promotion
        env:
          BASELINE_PATH: benchmarks/baselines/pliego-0.1.1-linux-x86_64.json
          GH_TOKEN: ${{ secrets.OXHQ_BENCHMARK_PROMOTION_TOKEN }}
          OPERATION: ${{ inputs.publication }}
        run: |
          set -euo pipefail
          test -z "${PLIEGO_BENCHMARK_ATTESTATION_HMAC_KEY_HEX:-}"
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$DEFAULT_BRANCH" = main
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -n "$GH_TOKEN"
          gh auth setup-git
          branch="benchmark-baseline/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OPERATION"
          expected_status=modified
          expected_worktree_status=" M $BASELINE_PATH"
          if [[ "$OPERATION" == bootstrap ]]; then
            expected_status=added
            expected_worktree_status="?? $BASELINE_PATH"
          fi
          test "$(git status --short --untracked-files=all)" = "$expected_worktree_status"
          expected_blob="$(git hash-object "$BASELINE_PATH")"

          verify_commit() {
            local commit=$1
            python3 benchmarks/tools/publication_promotion.py verify-github-commit \
              --repository "$CANONICAL_REPOSITORY" \
              --revision "$GITHUB_SHA" \
              --commit "$commit" \
              --path "$BASELINE_PATH" \
              --status "$expected_status" \
              --blob "$expected_blob" >/dev/null
          }

          list_exact_promotion_prs() {
            gh pr list \
              --repo "$CANONICAL_REPOSITORY" \
              --state all \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --json number,url,state,headRefOid,baseRefName,headRefName,headRepository,isCrossRepository | \
              python3 benchmarks/tools/publication_promotion.py select-promotion-prs \
                --repository "$CANONICAL_REPOSITORY" \
                --branch "$branch"
          }

          verify_single_pr() {
            local pull_requests=$1
            local state commit
            test "$(jq 'length' <<< "$pull_requests")" = 1
            state="$(jq -r '.[0].state' <<< "$pull_requests")"
            commit="$(jq -r '.[0].headRefOid' <<< "$pull_requests")"
            test "$(jq -r '.[0].baseRefName' <<< "$pull_requests")" = "$DEFAULT_BRANCH"
            verify_commit "$commit"
            case "$state" in
              OPEN|MERGED) jq -r '.[0].url' <<< "$pull_requests" ;;
              CLOSED)
                echo "existing exact promotion PR was closed without merge; refusing replacement" >&2
                return 1
                ;;
              *)
                echo "existing promotion PR has an unknown state: $state" >&2
                return 1
                ;;
            esac
          }

          existing_pr="$(list_exact_promotion_prs)"
          count="$(jq 'length' <<< "$existing_pr")"
          if [[ "$count" -gt 1 ]]; then
            echo "multiple promotion PRs exist for $branch" >&2
            exit 1
          fi
          if [[ "$count" == 1 ]]; then
            verify_single_pr "$existing_pr"
            exit 0
          fi

          current_main="$(gh api "repos/$CANONICAL_REPOSITORY/branches/$DEFAULT_BRANCH" --jq .commit.sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "main advanced after the benchmark; rerun instead of proposing stale evidence" >&2
            exit 1
          fi

          remote_commit="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [[ -n "$remote_commit" ]]; then
            verify_commit "$remote_commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add -- "$BASELINE_PATH"
            test "$(git diff --cached --name-only)" = "$BASELINE_PATH"
            git commit -m "benchmark: promote $OPERATION baseline from $GITHUB_SHA"
            test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
            remote_commit="$(git rev-parse HEAD)"
            if ! git push origin "HEAD:refs/heads/$branch"; then
              remote_commit="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
              test -n "$remote_commit"
              verify_commit "$remote_commit"
            fi
          fi

          verify_commit "$remote_commit"
          if ! created_pr="$(gh pr create \
              --repo "$CANONICAL_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "benchmark: promote $OPERATION baseline from ${GITHUB_SHA::12}" \
              --body "Review-only promotion of the HMAC-verified dedicated-host benchmark baseline from run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT at exact main revision $GITHUB_SHA. This workflow cannot push main directly.")"; then
            # A retry racing another exact invocation is accepted only if that
            # invocation opened the one exact PR we would have opened.
            existing_pr="$(list_exact_promotion_prs)"
            verify_single_pr "$existing_pr"
            exit 0
          fi
          # A successful create can still race a head rewrite or response
          # substitution; re-list the canonical repository and reverify it.
          existing_pr="$(list_exact_promotion_prs)"
          verified_pr="$(verify_single_pr "$existing_pr")"
          test "$created_pr" = "$verified_pr"
          printf '%s\n' "$verified_pr"

  github-hosted-negative:
    if: inputs.mode == 'negative-github-hosted'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prove GitHub-hosted runners fail before samples
        env:
          PROOF_DIR: ${{ runner.temp }}/pliego-host-proof-${{ github.run_id }}-${{ github.run_attempt }}
          PLIEGO_BENCHMARK_PROOF_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          python3 benchmarks/tools/benchmark_host_preflight.py \
            --mode negative-github-hosted \
            --output-dir "$PROOF_DIR" \
            -- python3 -c "raise SystemExit('samples must not start')"
          status=$?
          set -e
          test "$status" -ne 0
          python3 benchmarks/tools/validate_host_proof.py \
            "$PROOF_DIR/benchmark-host-proof.v1.json" \
            --expect-status rejected \
            --forbid-event samples.started

      - name: Retain negative diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-host-proof-negative-github-hosted-${{ github.sha }}
          path: ${{ runner.temp }}/pliego-host-proof-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
