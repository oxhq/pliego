name: Pliego Linux baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pliego-linux-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBCLANG_PATH: /usr/lib/llvm-14/lib
  RUST_BACKTRACE: 1
  SHELL: /bin/bash

jobs:
  baseline:
    name: Unchanged Servo build and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out the fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the Servo source is unchanged
        env:
          SERVO_BASE_SHA: 313b6d5ecc113b08010ce434140db3ca5abcc71c
        run: |
          git cat-file -e "${SERVO_BASE_SHA}^{commit}"
          git diff --exit-code "${SERVO_BASE_SHA}" -- . \
            ':(exclude).github/workflows/pliego-linux-baseline.yml' \
            ':(exclude)docs/pliego/linux-baseline.md'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: false

      - name: Bootstrap Servo
        timeout-minutes: 30
        run: |
          mkdir -p target/pliego-linux-baseline
          set -o pipefail
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean true" \
            | sudo debconf-set-selections
          sudo apt-get install -y tshark shellcheck
          ./mach bootstrap --yes --skip-lints --skip-nextest 2>&1 \
            | tee target/pliego-linux-baseline/bootstrap.log

      - name: Record the baseline environment
        env:
          SERVO_BASE_SHA: 313b6d5ecc113b08010ce434140db3ca5abcc71c
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "event_sha=${GITHUB_SHA}"
            echo "servo_base_sha=${SERVO_BASE_SHA}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "profile=checked-release"
            uname -a
            cat /etc/os-release
            rustc -Vv
            cargo -Vv
            python --version
            uv --version
            df -h .
          } | tee target/pliego-linux-baseline/environment.txt

      - name: Install Crown
        run: |
          set -o pipefail
          cargo install --path support/crown 2>&1 \
            | tee target/pliego-linux-baseline/crown.log

      - name: Build unchanged Servo
        run: |
          set -o pipefail
          ./mach build --use-crown --locked --profile checked-release 2>&1 \
            | tee target/pliego-linux-baseline/build.log

      - name: Run the Servo smoketest
        run: |
          set -o pipefail
          xvfb-run ./mach smoketest --profile checked-release 2>&1 \
            | tee target/pliego-linux-baseline/smoketest.log

      - name: Install Servo test tools
        run: |
          set -o pipefail
          {
            cargo install cargo-nextest --version 0.9.140 --locked
            cargo install taplo-cli --locked
            cargo install cargo-deny@0.19.0 --locked
            cargo nextest --version
            taplo --version
            cargo deny --version
            shellcheck --version
            tshark --version
          } 2>&1 | tee target/pliego-linux-baseline/test-tools.log

      - name: Run Servo script tests
        id: test_scripts
        continue-on-error: true
        run: |
          set -o pipefail
          ./mach test-scripts 2>&1 \
            | tee target/pliego-linux-baseline/test-scripts.log

      - name: Run Servo unit tests
        id: test_unit
        continue-on-error: true
        env:
          LANG: en-US
          NEXTEST_RETRIES: 2
        run: |
          set -o pipefail
          ./mach test-unit --profile checked-release --nextest-profile ci 2>&1 \
            | tee target/pliego-linux-baseline/test-unit.log

      - name: Run Servo clippy gate
        id: clippy
        continue-on-error: true
        env:
          CARGO_INCREMENTAL: 0
        run: |
          set -o pipefail
          ./mach clippy --locked --github-annotations -- -- --deny warnings 2>&1 \
            | tee target/pliego-linux-baseline/clippy.log

      - name: Run Servo tidy gate
        id: test_tidy
        continue-on-error: true
        run: |
          set -o pipefail
          ./mach test-tidy --no-progress --all --github-annotations 2>&1 \
            | tee target/pliego-linux-baseline/test-tidy.log

      - name: Record and enforce selected gate outcomes
        if: always()
        env:
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          SCRIPT_OUTCOME: ${{ steps.test_scripts.outcome }}
          TIDY_OUTCOME: ${{ steps.test_tidy.outcome }}
          UNIT_OUTCOME: ${{ steps.test_unit.outcome }}
        run: |
          mkdir -p target/pliego-linux-baseline
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "servo_base_sha=313b6d5ecc113b08010ce434140db3ca5abcc71c"
            echo "test_scripts_command=./mach test-scripts"
            echo "test_scripts_outcome=${SCRIPT_OUTCOME}"
            echo "test_unit_command=./mach test-unit --profile checked-release --nextest-profile ci"
            echo "test_unit_outcome=${UNIT_OUTCOME}"
            echo "clippy_command=./mach clippy --locked --github-annotations -- -- --deny warnings"
            echo "clippy_outcome=${CLIPPY_OUTCOME}"
            echo "test_tidy_command=./mach test-tidy --no-progress --all --github-annotations"
            echo "test_tidy_outcome=${TIDY_OUTCOME}"
          } | tee target/pliego-linux-baseline/results.txt
          test "${SCRIPT_OUTCOME}" = success
          test "${UNIT_OUTCOME}" = success
          test "${CLIPPY_OUTCOME}" = success
          test "${TIDY_OUTCOME}" = success

      - name: Record final disk usage
        if: always()
        run: |
          mkdir -p target/pliego-linux-baseline
          df -h . | tee target/pliego-linux-baseline/final-disk.txt

      - name: Retain baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-linux-baseline-${{ github.sha }}
          path: |
            target/pliego-linux-baseline/
            target/cargo-timings/
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7
