name: Linux
on:
  workflow_call:
    outputs:
      artifact_ids:
        value: ${{ jobs.build.outputs.artifact_ids }}
        description: Comma-separated list of artifact IDs for the release artifacts
    inputs:
      profile:
        required: false
        default: "checked-release"
        type: string
      build-args:
        default: ""
        required: false
        type: string
      wpt-args:
        default: ""
        required: false
        type: string
      wpt-sync-from-upstream:
        required: false
        default: false
        type: boolean
      wpt:
        required: false
        type: boolean
      number-of-wpt-chunks:
        default: 20
        required: false
        type: number
      unit-tests:
        required: false
        default: false
        type: boolean
      devtools-tests:
        required: false
        default: false
        type: boolean
      build-libservo:
        required: false
        default: false
        type: boolean
      force-github-hosted-runner:
        required: false
        type: boolean
        default: false
      bencher:
        required: false
        default: false
        type: boolean
      coverage:
        required: false
        default: false
        type: boolean
      capi:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      profile:
        required: false
        default: "checked-release"
        type: choice
        options: ["checked-release", "dev", "release", "production"]
      wpt-args:
        default: ""
        required: false
        type: string
      wpt-sync-from-upstream:
        default: false
        required: false
        type: boolean
      wpt:
        required: false
        type: boolean
      number-of-wpt-chunks:
        default: 20
        required: false
        type: number
      unit-tests:
        required: false
        default: false
        type: boolean
      devtools-tests:
        required: false
        default: false
        type: boolean
      build-libservo:
        required: false
        default: false
        type: boolean
      force-github-hosted-runner:
        required: false
        type: boolean
        default: false
      bencher:
        required: false
        default: false
        type: boolean
      capi:
        required: false
        default: false
        type: boolean

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash

jobs:
  # Runs the underlying job (“workload”) on a self-hosted runner if available,
  # with the help of a `runner-select` job and a `runner-timeout` job.
  runner-select:
    runs-on: ubuntu-24.04
    outputs:
      unique-id: ${{ steps.select.outputs.unique-id }}
      selected-runner-label: ${{ steps.select.outputs.selected-runner-label }}
      runner-type-label: ${{ steps.select.outputs.runner-type-label }}
      is-self-hosted: ${{ steps.select.outputs.is-self-hosted }}
    steps:
      - name: Runner select
        id: select
        uses: servo/ci-runners/actions/runner-select@f0b81b95522256c64ee207b4236ec71fc23b99a1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # Before updating the GH action runner image for the nightly job, ensure
          # that the system has a glibc version that is compatible with the one
          # used by the wpt.fyi runners.
          github-hosted-runner-label: ubuntu-22.04
          self-hosted-image-name: servo-ubuntu2204
          # You can disable self-hosted runners globally by creating a repository variable named
          # NO_SELF_HOSTED_RUNNERS with any non-empty value.
          # <https://github.com/servo/servo/settings/variables/actions>
          NO_SELF_HOSTED_RUNNERS: ${{ vars.NO_SELF_HOSTED_RUNNERS }}
          # Any other boolean conditions that disable self-hosted runners go here.
          force-github-hosted-runner: ${{ inputs.force-github-hosted-runner }}

  build:
    needs:
      - runner-select
    name: Linux Build [${{ needs.runner-select.outputs.unique-id }}]
    runs-on: ${{ needs.runner-select.outputs.selected-runner-label }}
    outputs:
      artifact_ids: ${{ steps.artifact_ids.outputs.artifact_ids }}
    steps:
      - uses: servo/ci-runners/actions/checkout@f0b81b95522256c64ee207b4236ec71fc23b99a1
      - name: Validate Cargo profile
        id: cargo-profile
        env:
          CARGO_PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          case "$CARGO_PROFILE_INPUT" in
            dev)
              profile_directory=debug
              ;;
            checked-release|release|production)
              profile_directory="$CARGO_PROFILE_INPUT"
              ;;
            *)
              printf 'unsupported Cargo profile: %s\n' "$CARGO_PROFILE_INPUT" >&2
              exit 2
              ;;
          esac
          {
            printf 'CARGO_PROFILE=%s\n' "$CARGO_PROFILE_INPUT"
            printf 'CARGO_PROFILE_DIR=%s\n' "$profile_directory"
          } >> "$GITHUB_ENV"
          printf 'output-directory=%s\n' "$profile_directory" >> "$GITHUB_OUTPUT"
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Set LIBCLANG_PATH env # needed for bindgen in mozangle
        if: ${{ runner.environment != 'self-hosted' }}
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV
      - name: Setup Python
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/setup-python
      - name: Change Mirror Priorities
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/apt-mirrors
      - name: Install cargo nextest
        if: ${{ inputs.unit-tests }}
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.140
      - name: Bootstrap dependencies
        if: ${{ runner.environment != 'self-hosted' }}
        timeout-minutes: 30
        run: |
          sudo apt update
          echo "wireshark-common wireshark-common/install-setuid boolean true" | sudo debconf-set-selections
          sudo apt install -qy poppler-utils shellcheck tshark
          ./mach bootstrap --yes --skip-lints --skip-nextest

      # Always install crown, even on self-hosted runners, because it is tightly
      # coupled to the rustc version, and we may have the wrong version if the
      # commit we are building uses a different rustc version.
      - name: Install crown
        run: cargo install --path support/crown

      - name: Build (${{ inputs.profile }})
        env:
          CARGO_BUILD_ARGS_INPUT: ${{ inputs.build-args }}
          RUSTFLAGS: ${{ inputs.profile == 'checked-release' && '-D warnings' || '' }}
        run: |
          python - "$CARGO_PROFILE" "$CARGO_BUILD_ARGS_INPUT" <<'PY'
          import os
          import shlex
          import sys

          profile, raw_build_args = sys.argv[1:]
          try:
              build_args = shlex.split(raw_build_args)
          except ValueError as error:
              raise SystemExit(f"invalid build arguments: {error}") from error
          build_type_options = {
              "--profile",
              "--dev",
              "--debug",
              "-d",
              "--release",
              "-r",
              "--prod",
              "--production",
          }
          for argument in build_args:
              # Mach's argparse parser accepts unique long-option abbreviations, so `--prof`
              # and longer prefixes can also replace the earlier validated `--profile` value.
              if argument in build_type_options or argument.startswith("--prof"):
                  raise SystemExit(
                      f"build arguments must not override the validated Cargo profile: {argument!r}"
                  )
          os.execv(
              "./mach",
              ["./mach", "build", "--use-crown", "--locked", "--profile", profile, *build_args],
          )
          PY
          mv target/cargo-timings target/cargo-timings-linux
      - name: Smoketest
        run: xvfb-run ./mach smoketest --profile "$CARGO_PROFILE"
      - name: Pliego paged reference
        env:
          CARGO_BUILD_RUSTC: crown
        run: |
          mkdir -p target/pliego-paged-reference
          set -o pipefail
          {
            # Match the preceding mach build's Servo options without enabling
            # Pliego's nonproduction servoshell oracle.
            python ports/pliego/tests/check_paged_reference.py --self-test &&
            tree="$(cargo tree -p pliego --locked --edges normal --prefix none \
              --features servo/crown,servo/media-gstreamer)" &&
            printf '%s\n' "$tree" &&
            grep -Eq '^servo v[0-9]' <<< "$tree" &&
            ! grep -Eq '^servoshell v[0-9]' <<< "$tree" &&
            cargo build -p pliego --locked --profile "$CARGO_PROFILE" \
              --features servo/crown,servo/media-gstreamer &&
            xvfb-run python ports/pliego/tests/check_paged_reference.py \
              "target/$CARGO_PROFILE_DIR/pliego"
          } 2>&1 | tee target/pliego-paged-reference/output.log
      - name: Retain Pliego paged reference output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pliego-paged-reference-${{ inputs.profile }}-${{ needs.runner-select.outputs.unique-id }}
          path: target/pliego-paged-reference/output.log
          if-no-files-found: warn
          retention-days: 7
      - name: Pliego canonical vertical slice
        run: |
          output=target/pliego-canonical-scene/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          mkdir -p "$output"
          set -o pipefail
          {
            python ports/pliego/tests/check_scene_vertical.py --self-test &&
            xvfb-run python ports/pliego/tests/check_scene_vertical.py \
              "target/$CARGO_PROFILE_DIR/pliego" "$output"
          } 2>&1 | tee "$output/output.log"
      - name: Retain Pliego canonical vertical slice
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pliego-canonical-scene-${{ inputs.profile }}-${{ needs.runner-select.outputs.unique-id }}
          path: target/pliego-canonical-scene/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
      - name: Pliego deterministic font resolution
        run: |
          mkdir -p target/pliego-font-resolution
          set -o pipefail
          {
            python ports/pliego/tests/check_font_resolution.py --self-test &&
            xvfb-run python ports/pliego/tests/check_font_resolution.py \
              "target/$CARGO_PROFILE_DIR/pliego"
          } 2>&1 | tee target/pliego-font-resolution/output.log
      - name: Retain Pliego font resolution proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pliego-font-resolution-${{ inputs.profile }}-${{ needs.runner-select.outputs.unique-id }}
          path: target/pliego-font-resolution/output.log
          if-no-files-found: warn
          retention-days: 7
      - name: Pliego paged typography
        run: |
          output=target/pliego-paged-typography/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          mkdir -p "$(dirname "$output")"
          python ports/pliego/tests/check_paged_typography.py --self-test
          xvfb-run python ports/pliego/tests/check_paged_typography.py \
            "target/$CARGO_PROFILE_DIR/pliego" "$output"
      - name: Retain Pliego paged typography proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pliego-paged-typography-${{ inputs.profile }}-${{ needs.runner-select.outputs.unique-id }}
          path: target/pliego-paged-typography/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
      - name: Setup Node for Chart.js fixture
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Pliego paged product gates
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python - <<'PY'
          import sys

          if sys.version_info < (3, 10):
              raise SystemExit(
                  f"Pliego's deterministic-environment gate requires Python >=3.10; found {sys.version.split()[0]}"
              )
          print(f"Pliego gate Python: {sys.version.split()[0]}")
          PY
          python -c "import sys; from PIL import Image; print(sys.executable, Image.__version__)"
          binary="target/$CARGO_PROFILE_DIR/pliego"
          output=target/pliego-product-gates/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          mkdir -p "$output"
          set -o pipefail
          {
            python ports/pliego/tests/check_forced_breaks.py --self-test &&
            xvfb-run python ports/pliego/tests/check_forced_breaks.py \
              "$binary" "$output/forced-breaks" &&
            python ports/pliego/tests/check_break_inside.py --self-test &&
            xvfb-run python ports/pliego/tests/check_break_inside.py \
              "$binary" "$output/break-inside" &&
            python ports/pliego/tests/check_paged_ci.py --self-test &&
            xvfb-run python ports/pliego/tests/check_paged_ci.py "$binary" "$output/paged-ci" &&
            python ports/pliego/tests/check_table_pagination.py --self-test &&
            xvfb-run python ports/pliego/tests/check_table_pagination.py "$binary" &&
            python ports/pliego/tests/check_table_captions.py --self-test &&
            xvfb-run python ports/pliego/tests/check_table_captions.py "$binary" &&
            python ports/pliego/tests/check_table_oversized_row.py --self-test &&
            xvfb-run python ports/pliego/tests/check_table_oversized_row.py "$binary" &&
            python ports/pliego/tests/check_table_row_constraints.py --self-test &&
            xvfb-run python ports/pliego/tests/check_table_row_constraints.py "$binary" &&
            python ports/pliego/tests/check_table_header_footer.py --self-test &&
            xvfb-run python ports/pliego/tests/check_table_header_footer.py "$binary" &&
            python ports/pliego/tests/check_table_rowspans.py --self-test &&
            xvfb-run python ports/pliego/tests/check_table_rowspans.py "$binary" &&
            python ports/pliego/tests/check_table_borders.py --self-test &&
            xvfb-run python ports/pliego/tests/check_table_borders.py "$binary" &&
            python ports/pliego/tests/check_document_gate.py --self-test &&
            xvfb-run python ports/pliego/tests/check_document_gate.py \
              "$binary" "$output/document-gate" "$CARGO_PROFILE" &&
            xvfb-run python ports/pliego/tests/check_deterministic_environment.py "$binary" &&
            python ports/pliego/tests/check_resource_policy.py --self-test &&
            xvfb-run python ports/pliego/tests/check_resource_policy.py "$binary" "$output/resource-policy" &&
            python ports/pliego/tests/check_asset_cache.py --self-test &&
            xvfb-run python ports/pliego/tests/check_asset_cache.py "$binary" "$output/asset-cache" &&
            xvfb-run python ports/pliego/tests/check_live_fonts.py "$binary" "$output/live-fonts" &&
            python ports/pliego/tests/check_hybrid_canvas_live.py --self-test &&
            xvfb-run python ports/pliego/tests/check_hybrid_canvas_live.py "$binary" "$output/canvas" &&
            python ports/pliego/tests/check_chartjs_report.py --self-test &&
            xvfb-run python ports/pliego/tests/check_chartjs_report.py \
              "$binary" "$output/chartjs-report" &&
            python ports/pliego/tests/check_svg_vector.py --self-test &&
            xvfb-run python ports/pliego/tests/check_svg_vector.py "$binary" "$output/svg"
          } 2>&1 | tee "$output/output.log"
      - name: Retain Pliego paged product-gate proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pliego-product-gates-${{ inputs.profile }}-${{ needs.runner-select.outputs.unique-id }}
          path: target/pliego-product-gates/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
      - name: Pliego image limits
        run: |
          output=target/pliego-image-limits/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          mkdir -p "$(dirname "$output")"
          python ports/pliego/tests/check_image_limits.py --self-test
          xvfb-run python ports/pliego/tests/check_image_limits.py \
            "target/$CARGO_PROFILE_DIR/pliego" "$output"
      - name: Retain Pliego image limit proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pliego-image-limits-${{ inputs.profile }}-${{ needs.runner-select.outputs.unique-id }}
          path: target/pliego-image-limits/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
      - name: Script tests
        run: ./mach test-scripts
      - name: Unit tests
        id: run_unit_tests
        if: ${{ inputs.unit-tests }}
        env:
          NEXTEST_RETRIES: 2 # https://github.com/servo/servo/issues/30683
          LANG: en-US
        run: |
          ./mach test-unit --profile "$CARGO_PROFILE" --nextest-profile ci
          ./mach test-unit --profile "$CARGO_PROFILE" --doc
      # We upload the test-results to Codecov to help us identify flaky unit-tests.
      - name: Upload test results to Codecov
        # Upload test results to Codecov, also for failed unit-tests, but only
        # if unit-tests were supposed to run, and not if they were skipped (e.g., due
        # to an earlier failure).
        if: ${{ !cancelled() && steps.run_unit_tests.conclusion != 'skipped' }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          files: target/nextest/ci/junit.xml
          disable_search: true
          flags: unittests,unittests-linux,unittests-linux-${{ inputs.profile }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Devtools tests
        if: ${{ inputs.devtools-tests }}
        run: ./mach test-devtools --profile "$CARGO_PROFILE"
      - name: Archive build timing
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-linux-${{ inputs.profile }}
          # Using a wildcard here ensures that the archive includes the path.
          path: target/cargo-timings-*
          if-no-files-found: error
      - name: Build mach package
        run: ./mach package --profile "$CARGO_PROFILE"
      - name: Upload artifact for mach package
        uses: actions/upload-artifact@v7
        id: upload-tarball
        with:
          name: ${{ inputs.profile }}-binary-linux
          path: target/${{ steps.cargo-profile.outputs.output-directory }}/servo-tech-demo.tar.gz
          if-no-files-found: error
      - name: Collect artifact IDs needed by the release workflow
        id: artifact_ids
        shell: bash
        run: |
          echo "artifact_ids=${{steps.upload-tarball.outputs.artifact-id}}" >> $GITHUB_OUTPUT

  wpt-2020:
    if: ${{ inputs.wpt }}
    name: Linux WPT
    needs: ["build"]
    uses: ./.github/workflows/linux-wpt.yml
    with:
      wpt-args: ${{ inputs.wpt-args }}
      profile: ${{ inputs.profile }}
      wpt-sync-from-upstream: ${{ inputs.wpt-sync-from-upstream }}
      number-of-wpt-chunks: ${{ fromJSON(format('{0}', inputs.number-of-wpt-chunks)) }}
      binary-path: servo/servoshell
    secrets: inherit

  bencher:
    needs: ["build"]
    if: ${{ inputs.bencher && inputs.profile != 'dev' && github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group' }}
    uses: ./.github/workflows/bencher.yml
    with:
      target: "linux"
      profile: ${{ inputs.profile }}
      compressed-file-path: ${{ inputs.profile }}-binary-linux/servo-tech-demo.tar.gz
      binary-path: servo/servoshell
      file-size: true
      # We only evaluate speedometer and dromaeo score in release
      speedometer: ${{ inputs.profile == 'release' }}
      dromaeo: ${{ inputs.profile == 'release' }}
    secrets: inherit

  build-libservo:
    if: ${{ inputs.build-libservo }}
    name: Build libservo and MSRV check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'pull_request_target'
        with:
          fetch-depth: 1
      # This is necessary to checkout the pull request if this run was triggered via a
      # `pull_request_target` event.
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Set LIBCLANG_PATH env # needed for bindgen in mozangle
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Determine MSRV
        id: msrv
        uses: ./.github/actions/parse_msrv
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.rust_version }}
      # We can remove this after upgrading to Rust 1.90, but for now
      # installing lld is the easiest way to get it in path.
      - name: install lld
        run: sudo apt-get install -y lld
      - name: Compile libservo with MSRV
        env:
          # lld seems to use less memory and prevents OOM errors during linking.
          # We can remove this after upgrading to Rust 1.90, where lld will be the default.
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          LLVM_OBJDUMP: llvm-objdump-14
        run: |
          cargo +${{ steps.msrv.outputs.rust_version }} build -p servo --locked

  capi:
    if: ${{ inputs.capi }}
    name: Build and test Servo's C API
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        if: github.event_name != 'pull_request_target'
        with:
          fetch-depth: 1
      # This is necessary to checkout the pull request if this run was triggered via a
      # `pull_request_target` event.
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Set LIBCLANG_PATH env # needed for bindgen in mozangle
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Change Mirror Priorities
        uses: ./.github/actions/apt-mirrors
      - name: Install EGL library and headers
        run: |
          sudo apt update
          sudo apt install -y libegl1-mesa-dev libegl-dev
      - name: Install cargo-c # required by servo-capi-tests's build.rs
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-c@0.10.23
      - name: Build and test servo-capi-tests
        run: cargo test -p servo-capi-tests --locked

  # Runs the underlying job (“workload”) on a self-hosted runner if available.
  runner-select-coverage:
    if: inputs.coverage
    runs-on: ubuntu-24.04
    outputs:
      unique-id: ${{ steps.select.outputs.unique-id }}
      selected-runner-label: ${{ steps.select.outputs.selected-runner-label }}
      is-self-hosted: ${{ steps.select.outputs.is-self-hosted }}
    steps:
      - name: Runner select
        id: select
        uses: servo/ci-runners/actions/runner-select@f0b81b95522256c64ee207b4236ec71fc23b99a1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # Before updating the GH action runner image for the nightly job, ensure
          # that the system has a glibc version that is compatible with the one
          # used by the wpt.fyi runners.
          github-hosted-runner-label: ubuntu-22.04
          self-hosted-image-name: servo-ubuntu2204
          # You can disable self-hosted runners globally by creating a repository variable named
          # NO_SELF_HOSTED_RUNNERS with any non-empty value.
          # <https://github.com/servo/servo/settings/variables/actions>
          NO_SELF_HOSTED_RUNNERS: ${{ vars.NO_SELF_HOSTED_RUNNERS }}
          # Any other boolean conditions that disable self-hosted runners go here.
          force-github-hosted-runner: ${{ inputs.force-github-hosted-runner }}

  unit-test-coverage:
    if: inputs.coverage
    needs: runner-select-coverage
    name: Unit Test Coverage [${{ needs.runner-select-coverage.outputs.unique-id }}]
    runs-on: ${{ needs.runner-select-coverage.outputs.selected-runner-label }}
    continue-on-error: true
    steps:
      - uses: servo/ci-runners/actions/checkout@f0b81b95522256c64ee207b4236ec71fc23b99a1
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Set LIBCLANG_PATH env # needed for bindgen in mozangle
        shell: bash
        if: ${{ runner.environment != 'self-hosted' }}
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV
      - name: Setup Python
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/setup-python
      - name: Change Mirror Priorities
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/apt-mirrors
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.140
      - name: Bootstrap dependencies
        if: ${{ runner.environment != 'self-hosted' }}
        timeout-minutes: 30
        shell: bash
        run: |
          sudo apt update
          ./mach bootstrap --yes --skip-lints
      - name: Run unit-tests with coverage
        shell: bash
        env:
          NEXTEST_RETRIES: 2 # https://github.com/servo/servo/issues/30683
          LANG: en-US
        run: |
          ./mach test-unit --code-coverage \
              --profile=coverage \
              --llvm-cov-option=--codecov \
              --llvm-cov-option=--output-path=codecov.json
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json,support/crown/codecov.json
          fail_ci_if_error: true
          flags: unittests

  media-examples:
    name: Media Examples
    if: ${{ inputs.unit-tests }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'pull_request_target'
        with:
          fetch-depth: 1
      # This is necessary to checkout the pull request if this run was triggered via a
      # `pull_request_target` event.
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Change Mirror Priorities
        uses: ./.github/actions/apt-mirrors
      - name: Install Dependencies
        run: |
          sudo bash -c 'apt-add-repository -y https://mirrors.kernel.org/ubuntu'
          sudo apt update
          sudo apt install -y \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools \
            jackd2 \
            libasound2-plugins \
            libfaad2 \
            libffi7 \
            libfftw3-single3 \
            libges-1.0-dev \
            libgstreamer-plugins-bad1.0-dev\
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgstrtspserver-1.0-dev \
            libjack-jackd2-0 \
            libmms0 \
            libmpg123-0 \
            libopus0 \
            liborc-0.4-0 \
            liborc-0.4-dev \
            libpulsedsp \
            libsamplerate0 \
            libspeexdsp1 \
            libtdb1 \
            libtheora0 \
            libtwolame0 \
            libwayland-egl1-mesa \
            libwebrtc-audio-processing1 \
            pulseaudio \
            pulseaudio-utils \
            webp
      - name: Determine MSRV
        id: msrv
        uses: ./.github/actions/parse_msrv
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.rust_version }}
      - name: Virtual Audio Devices
        run: |
          jackd -d dummy &
          pulseaudio --start
          gst-inspect-1.0 | grep Total
      - name: Set LIBCLANG_PATH env # needed for bindgen
        shell: bash
        if: ${{ runner.environment != 'self-hosted' }}
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV
      - name: Run Examples
        run: |
          ls components/media/examples/examples/*.rs | xargs -I{} basename  {} .rs  | grep -v params_connect | RUST_BACKTRACE=1 GST_DEBUG=3 xargs -I{} cargo run -p servo-media-examples --example {}
