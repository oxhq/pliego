name: Pliego direct document session

on:
  push:
    branches: ["main"]
    paths: &document-session-paths
      - ".github/workflows/pliego-document-session.yml"
      - ".github/actions/apt-mirrors/**"
      - ".github/actions/setup-python/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "contracts/api2/**"
      - "docs/pliego/adr/0018-api-2-contract-and-public-artifacts.md"
      - "rust-toolchain.toml"
      - "ports/pliego/**"
      - "components/canvas/**"
      - "components/constellation/**"
      - "components/fonts/**"
      - "components/layout/**"
      - "components/paint/**"
      - "components/script/**"
      - "components/servo/**"
      - "components/shared/canvas/**"
      - "components/shared/constellation/**"
      - "components/shared/embedder/**"
      - "components/shared/fonts/**"
      - "components/shared/paint/**"
      - "components/shared/script/**"
      - "components/timers/**"
      - "sdk/php/**"
      - "benchmarks/fixtures/minimal-static/**"
  pull_request:
    paths: *document-session-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pliego-document-session-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  production-session:
    runs-on: ubuntu-24.04
    # The measured debug prefix took 90m; a prior full feature/runtime tail took 17m.
    # Bound the complete CI job with runner headroom; native/caller limits stay unchanged.
    timeout-minutes: 150

    steps:
      - name: Check out Pliego
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Install and check the pinned PDF annotation oracle
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r ports/pliego/tests/requirements-api2-links.txt
          python ports/pliego/tests/check_api2_links.py --self-test --pypdf-version 6.16.2

      - name: Cache Rust compilation
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Prefer the main Ubuntu mirror
        uses: ./.github/actions/apt-mirrors

      - name: Bootstrap Linux dependencies
        timeout-minutes: 30
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libclang-dev \
            poppler-utils
          libclang="$(
            find /usr/lib/llvm-* -maxdepth 2 \
              \( -type f -o -type l \) -name libclang.so -print \
              | sort --version-sort \
              | tail -n 1
          )"
          test -n "$libclang"
          test -r "$libclang"
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          printf 'Using libclang: %s\n' "$libclang"
          ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Check the production dependency boundary
        run: |
          for feature_set in default direct; do
            if [[ "$feature_set" == default ]]; then
              tree="$(cargo tree -p pliego --edges normal --prefix none --locked)"
            else
              tree="$(cargo tree -p pliego --no-default-features --features document-session --edges normal --prefix none --locked)"
            fi
            printf '%s graph:\n%s\n' "$feature_set" "$tree"
            grep -Eq '^servo v[0-9]' <<< "$tree"
            if grep -Eq '^servoshell v[0-9]' <<< "$tree"; then
              echo "$feature_set document-session graph pulled in servoshell" >&2
              exit 1
            fi
          done

      - name: Test the production document session and build identity helpers
        env:
          PLIEGO_INVOICE_ORACLE_EVIDENCE_ROOT: ${{ runner.temp }}/pliego-invoice-oracle
        run: cargo test -p pliego --test document_session --test build_script --locked

      - name: Retain exact invoice reference scene and PDF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-direct-invoice-oracle
          path: ${{ runner.temp }}/pliego-invoice-oracle
          if-no-files-found: warn
          retention-days: 30

      - name: Test Canvas retention and capture accounting
        run: |
          cargo test -p servo-canvas --lib retained_canvas::tests --locked
          cargo test -p pliego --lib --no-default-features --locked

      - name: Prove bounded paginated and nonpainting content
        run: |
          set -euo pipefail
          selected="$(cargo test -p servo-layout --lib --locked -- --list)"
          for test_name in \
            pages::tests::fixed_subtrees_cannot_claim_or_extend_the_final_page_count \
            pages::tests::out_of_flow_placeholders_preserve_breaks_and_source_child_indices \
            positioned::paged_fixed_tests::computed_vertical_writing_modes_are_rejected \
            display_list::debug_capture_tests::empty_paint_area_requires_exact_valid_zero_extent \
            display_list::debug_capture_tests::partial_horizontal_rules_preserve_tracks_gaps_and_row_ownership \
            display_list::debug_capture_tests::ordinary_solid_borders_keep_source_app_units \
            display_list::debug_capture_tests::retained_rectangles_reject_negative_origins_and_mixed_border_colors \
            table::collapsed_border_profile_tests::horizontal_rules_accept_zero_width_gaps_in_either_column \
            table::collapsed_border_profile_tests::horizontal_rules_reject_dashed_nonzero_invisible_and_nonuniform_lines \
            flow::inline::page_counter_tests::page_counter_realization_preserves_literal_zero_and_utf8_controls \
            flow::inline::page_counter_tests::page_counter_realization_rejects_invalid_context_and_unowned_ranges \
            flow::inline::page_counter_tests::page_counter_offset_rejects_split_token_and_overflow; do
            printf '%s\n' "$selected" | grep -Fx "$test_name: test"
            cargo test -p servo-layout --lib --locked "$test_name" -- --exact
          done
          cargo test -p pliego --test scene_capture --locked \
            retains_typed_paged_fixed_and_counter_exclusions -- --exact
          cargo build -p pliego --bin pliego --locked
          python ports/pliego/tests/check_api2_fixed_content.py --self-test
          fixed_status=0
          python ports/pliego/tests/check_api2_fixed_content.py \
            --binary "$PWD/target/debug/pliego" \
            --source-commit "$(git rev-parse HEAD)" --process-timeout-seconds 180 \
            --proof-directory "$RUNNER_TEMP/pliego-fixed-content" --require-pdf-text || fixed_status=$?
          python ports/pliego/tests/check_api2_nonpainting_content.py --self-test
          nonpainting_status=0
          python ports/pliego/tests/check_api2_nonpainting_content.py \
            --binary "$PWD/target/debug/pliego" \
            --source-commit "$(git rev-parse HEAD)" --process-timeout-seconds 180 \
            --proof-directory "$RUNNER_TEMP/pliego-nonpainting-content" --require-pdf-text || nonpainting_status=$?
          test "$fixed_status" -eq 0 && test "$nonpainting_status" -eq 0

      - name: Retain paginated fixed-content proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-direct-fixed-content-proof
          path: ${{ runner.temp }}/pliego-fixed-content
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Retain nonpainting-content proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-direct-nonpainting-content-proof
          path: ${{ runner.temp }}/pliego-nonpainting-content
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Set up Node for the locked Chart.js fixture
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Test unmodified Chart.js twice in fresh sessions
        env:
          PLIEGO_CHARTJS_ORACLE_EVIDENCE_ROOT: ${{ runner.temp }}/pliego-chartjs-oracle
        run: |
          source_fixture="$PWD/ports/pliego/tests/fixtures/chartjs-report"
          fixture="$RUNNER_TEMP/pliego-document-session-chartjs"
          font="$PWD/components/fonts/tests/support/dejavu-fonts-ttf-2.37/ttf/DejaVuSans.ttf"
          test ! -e "$fixture"
          cp -a "$source_fixture" "$fixture"
          cp "$font" "$fixture/ReportSans.ttf"
          npm ci --prefix "$fixture" --ignore-scripts --no-audit --no-fund
          PLIEGO_DOCUMENT_SESSION_CHARTJS_INPUT="$fixture/index.html" \
            cargo test -p pliego --test document_session --locked \
              document_session::tests::installed_chartjs_fixture_matches_the_reviewed_snapshot_twice \
              -- --exact --ignored --nocapture

      - name: Retain exact Chart.js reference scene and PDF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-direct-chartjs-oracle
          path: ${{ runner.temp }}/pliego-chartjs-oracle
          if-no-files-found: warn
          retention-days: 30

      - name: Test the shared resource policy
        run: |
          cargo test -p pliego --bin pliego --locked
          python ports/pliego/tests/check_resource_policy.py --self-test
          cargo build -p pliego --bin pliego --locked
          xvfb-run python ports/pliego/tests/check_resource_policy.py \
            "$PWD/target/debug/pliego" \
            "$RUNNER_TEMP/pliego-resource-policy"

      - name: Retain shared resource-policy proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-direct-resource-policy-proof
          path: ${{ runner.temp }}/pliego-resource-policy
          if-no-files-found: warn
          retention-days: 30

      - name: Prove production render-supervisor framing and containment
        run: |
          set -euo pipefail
          selected_tests="$(cargo test -p pliego --bin pliego --locked \
            render_supervisor::tests:: -- --list | awk 'sub(/: test$/, "") { print }')"
          supervisor_test_count="$(printf '%s\n' "$selected_tests" | awk '/^render_supervisor::tests::/ { count++ } END { print count + 0 }')"
          if [[ "$supervisor_test_count" -lt 1 ]]; then
            echo '::error::No render_supervisor::tests:: tests were selected.'
            exit 1
          fi
          unexpected_tests="$(printf '%s\n' "$selected_tests" | awk 'NF && $0 !~ /^render_supervisor::tests::/ { print }')"
          if [[ -n "$unexpected_tests" ]]; then
            echo '::error::The render-supervisor filter selected tests outside render_supervisor::tests::.'
            printf '%s\n' "$unexpected_tests"
            exit 1
          fi
          cargo test -p pliego --bin pliego --locked render_supervisor::tests::
          python ports/pliego/tests/check_render_supervisor.py --self-test
          xvfb-run python ports/pliego/tests/check_render_supervisor.py \
            --pliego "$PWD/target/debug/pliego" \
            --proof-directory "$RUNNER_TEMP/pliego-render-supervisor-proof" \
            --source-commit "$(git rev-parse HEAD)" \
            --target x86_64-unknown-linux-gnu

      - name: Upload direct render-supervisor proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-direct-render-supervisor-proof
          path: ${{ runner.temp }}/pliego-render-supervisor-proof
          if-no-files-found: error
          retention-days: 30

      - name: Prove generation-bound controlled capture and fail-closed publication
        run: |
          python ports/pliego/tests/check_controlled_capture.py --self-test
          xvfb-run python ports/pliego/tests/check_controlled_capture.py \
            "$PWD/target/debug/pliego" \
            "$RUNNER_TEMP/pliego-controlled-capture"

      - name: Prove unmodified Chart.js through the controlled CLI twice
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python ports/pliego/tests/check_chartjs_report.py --self-test
          xvfb-run python ports/pliego/tests/check_chartjs_report.py \
            --controlled \
            "$PWD/target/debug/pliego" \
            "$RUNNER_TEMP/pliego-controlled-chartjs"

      - name: Test exact paint, table-repeat geometry and collapsed-border profiles
        run: |
          set -euo pipefail
          selected="$(cargo test -p servo-layout --lib --locked -- --list)"
          printf '%s\n' "$selected" | grep -Fx 'pages::tests::table_repeat_debug_geometry_retains_original_app_units: test'
          printf '%s\n' "$selected" | grep -Fx 'display_list::debug_capture_tests::horizontal_table_rules_retain_exact_geometry_and_row_ownership: test'
          for test_name in \
            display_list::debug_capture_tests::background_rectangles_keep_original_app_units_without_float_recovery \
            display_list::debug_capture_tests::ordinary_background_authority_belongs_to_the_original_owner_rectangle \
            display_list::debug_capture_tests::background_authority_keeps_geometry_and_effect_exclusions \
            display_list::debug_capture_tests::paged_canvas_covers_all_four_a4_content_areas_in_original_app_units \
            display_list::background::exact_color_area_tests::only_unlayered_scroll_border_box_color_has_exact_area_authority; do
            printf '%s\n' "$selected" | grep -Fx "$test_name: test"
          done
          count="$(printf '%s\n' "$selected" | grep -c '^table::collapsed_border_profile_tests::.*: test$')"
          test "$count" -ge 4
          cargo test -p servo-layout --lib --locked \
            pages::tests::table_repeat_debug_geometry_retains_original_app_units -- --exact
          cargo test -p servo-layout --lib --locked table::collapsed_border_profile_tests::
          cargo test -p servo-layout --lib --locked display_list::debug_capture_tests::
          cargo test -p servo-layout --lib --locked display_list::background::exact_color_area_tests::

      - name: Prove API 2 tables, links and fail-closed exclusions
        run: |
          # Unoptimized executables self-hash before starting Servo. Match the existing
          # valid-render closure's startup allowance; engine host_wall_ms uses API default 60000.
          python ports/pliego/tests/check_api2_headerless_tables.py --self-test
          table_status=0
          python ports/pliego/tests/check_api2_headerless_tables.py \
            --binary "$PWD/target/debug/pliego" \
            --source-commit "$(git rev-parse HEAD)" \
            --process-timeout-seconds 180 \
            --proof-directory "$RUNNER_TEMP/pliego-controlled-capture/api2-headerless-tables" \
            --require-pdf-text || table_status=$?
          link_status=0
          python ports/pliego/tests/check_api2_links.py \
            --binary "$PWD/target/debug/pliego" \
            --source-commit "$(git rev-parse HEAD)" --pypdf-version 6.16.2 \
            --process-timeout-seconds 180 \
            --proof-directory "$RUNNER_TEMP/pliego-controlled-capture/api2-links" || link_status=$?
          python ports/pliego/tests/check_api2_table_backgrounds.py --self-test
          background_status=0
          python ports/pliego/tests/check_api2_table_backgrounds.py \
            --binary "$PWD/target/debug/pliego" \
            --source-commit "$(git rev-parse HEAD)" --process-timeout-seconds 180 \
            --proof-directory "$RUNNER_TEMP/pliego-controlled-capture/api2-table-backgrounds" || background_status=$?
          test "$table_status" -eq 0 && test "$link_status" -eq 0 && test "$background_status" -eq 0

      - name: Upload direct controlled-capture proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-direct-controlled-capture-proof
          path: |
            ${{ runner.temp }}/pliego-controlled-capture
            ${{ runner.temp }}/pliego-controlled-chartjs
          if-no-files-found: error
          retention-days: 7

      - name: Test the PHP bridge against the production binary
        run: |
          composer --no-interaction --no-plugins --no-scripts --working-dir=sdk/php install --no-progress
          php sdk/php/tests/production_binary_test.php "$PWD/target/debug/pliego"

      - name: Test the CLI error boundary
        run: cargo test -p pliego --bin pliego session_failures_preserve_the_engine_error_classes --locked

      - name: Test the advertised API 2 executable closure
        run: |
          python contracts/api2/test_contract.py
          python ports/pliego/tests/check_api2_contract.py --self-test
          cargo test -p pliego --bin pliego api2::tests --locked
          cargo build -p pliego --bin pliego --locked
          pliego_version="$(python -c 'import json, subprocess; data=json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])); print(next(package["version"] for package in data["packages"] if package["name"] == "pliego"))')"
          python ports/pliego/tests/check_api2_contract.py \
            --binary "$PWD/target/debug/pliego" \
            --expected-version "$pliego_version" \
            --expected-source-commit "$(git rev-parse HEAD)" \
            --expected-target x86_64-unknown-linux-gnu \
            --expected-servo-base 313b6d5ecc113b08010ce434140db3ca5abcc71c \
            --valid-request contracts/api2/goldens/accepted/render-request.a4.json \
            --proof-output "$RUNNER_TEMP/pliego-api2-executable-proof.json"
          php sdk/php/tests/api2_contract_test.php "$PWD/target/debug/pliego"

      - name: Check runtime feature matrices
        run: |
          cargo check -p pliego --bin pliego --locked
          cargo check -p pliego --bin pliego --no-default-features --features document-session --locked
          cargo check -p pliego --bin pliego --no-default-features --features shell-oracle --locked
          cargo check -p pliego --bin pliego --no-default-features --features shell --locked
          cargo check -p pliego --bin pliego --no-default-features --features document-session,shell-oracle --locked

      - name: Test the explicit nonproduction shell oracle
        run: |
          tree="$(cargo tree -p pliego --no-default-features --features shell-oracle --edges normal --prefix none --locked)"
          printf '%s\n' "$tree"
          grep -Eq '^servoshell v[0-9]' <<< "$tree"
          cargo test -p pliego --bin pliego --no-default-features --features shell-oracle --locked
          cargo run -p pliego --bin pliego --no-default-features --features shell-oracle --locked -- --help > shell-oracle-help.txt
          grep -F 'NONPRODUCTION ORACLE BUILD' shell-oracle-help.txt
          grep -F 'Runtime: servoshell-oracle' shell-oracle-help.txt

      - name: Prove combined runtime selection and recovery isolation
        run: |
          cargo test -p pliego --bin pliego --no-default-features --features document-session,shell-oracle --locked tests::runtime_selection_is_explicit_and_direct_wins_combined_builds -- --exact
          cargo test -p pliego --bin pliego --no-default-features --features document-session,shell-oracle --locked tests::cross_runtime_publication_recovery_is_rejected_without_mutation -- --exact
          cargo run -p pliego --bin pliego --no-default-features --features document-session,shell-oracle --locked -- --help > combined-help.txt
          grep -F 'Runtime: document-session' combined-help.txt
          if grep -F 'NONPRODUCTION ORACLE BUILD' combined-help.txt; then
            echo 'combined build selected the shell oracle instead of DocumentSession' >&2
            exit 1
          fi

      - name: Reject a binary with no runtime selected
        run: |
          if cargo check -p pliego --bin pliego --no-default-features --locked 2> no-runtime.stderr; then
            echo 'runtime-free Pliego binary unexpectedly compiled' >&2
            exit 1
          fi
          cat no-runtime.stderr
          grep -F 'requires either the default document-session runtime or the explicit shell-oracle feature' no-runtime.stderr
          if grep -Eq '^error\[E[0-9]+\]:' no-runtime.stderr; then
            echo 'runtime-free Pliego emitted a secondary Rust type or resolution error' >&2
            exit 1
          fi
