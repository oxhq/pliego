name: Pliego direct document session

on:
  push:
    branches: ["main"]
    paths: &document-session-paths
      - ".github/workflows/pliego-document-session.yml"
      - ".github/actions/apt-mirrors/**"
      - ".github/actions/setup-python/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "ports/pliego/**"
      - "components/fonts/**"
      - "components/layout/**"
      - "components/script/**"
      - "components/servo/**"
      - "components/shared/fonts/**"
      - "components/shared/script/**"
  pull_request:
    paths: *document-session-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pliego-document-session-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  direct-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out Pliego
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Cache Rust compilation
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Prefer the main Ubuntu mirror
        uses: ./.github/actions/apt-mirrors

      - name: Bootstrap Linux dependencies
        timeout-minutes: 30
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-dev
          libclang="$(
            find /usr/lib/llvm-* -maxdepth 2 \
              \( -type f -o -type l \) -name libclang.so -print \
              | sort --version-sort \
              | tail -n 1
          )"
          test -n "$libclang"
          test -r "$libclang"
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          printf 'Using libclang: %s\n' "$libclang"
          ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Check the direct dependency boundary
        run: |
          tree="$(cargo tree -p pliego --no-default-features --features document-session --edges normal --prefix none --locked)"
          printf '%s\n' "$tree"
          grep -Eq '^servo v[0-9]' <<< "$tree"
          if grep -Eq '^servoshell v[0-9]' <<< "$tree"; then
            echo "direct document-session graph pulled in servoshell" >&2
            exit 1
          fi

      - name: Test the direct document session
        run: cargo test -p pliego --test document_session --no-default-features --features document-session --locked

      - name: Test the CLI error boundary
        run: cargo test -p pliego --bin pliego --features document-session session_failures_preserve_the_engine_error_classes --locked

      - name: Check default and combined binaries
        run: |
          cargo check -p pliego --bin pliego --locked
          cargo check -p pliego --bin pliego --no-default-features --features shell,document-session --locked
