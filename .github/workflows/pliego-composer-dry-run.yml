name: Pliego Composer distribution dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pliego-composer-dry-run.yml
      - Cargo.toml
      - Cargo.lock
      - LICENSE
      - LICENSE_WHATWG_SPECS
      - docs/pliego/third-party-notices.md
      - licenses/**
      - ports/pliego/Cargo.toml
      - ports/pliego-core-benchmark/Cargo.toml
      - python/check_pliego_release_archive.py
      - python/check_pliego_version.py
      - resources/resource_protocol/license.html
      - sdk/php/**
      - sdk/laravel/**
      - tests/pliego/laravel-invoice/composer.json
      - tests/pliego/laravel-invoice/composer.lock

permissions:
  contents: read

concurrency:
  group: pliego-composer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and stage Composer packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Pliego
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Check release archive contract and source assets
        run: python python/check_pliego_release_archive.py --self-test --check-source-assets .

      - name: Resolve and verify engine and SDK versions
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          cargo = tomllib.loads(pathlib.Path("ports/pliego/Cargo.toml").read_text(encoding="utf-8"))
          benchmark = tomllib.loads(pathlib.Path("ports/pliego-core-benchmark/Cargo.toml").read_text(encoding="utf-8"))
          workspace = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text(encoding="utf-8"))
          laravel = json.loads(pathlib.Path("sdk/laravel/composer.json").read_text(encoding="utf-8"))
          runtimes = json.loads(pathlib.Path("sdk/laravel/resources/runtimes.json").read_text(encoding="utf-8"))
          fixture = json.loads(pathlib.Path("tests/pliego/laravel-invoice/composer.json").read_text(encoding="utf-8"))
          fixture_lock = json.loads(pathlib.Path("tests/pliego/laravel-invoice/composer.lock").read_text(encoding="utf-8"))
          engine_version = cargo["package"]["version"]
          php_version = pathlib.Path("sdk/php/VERSION").read_text(encoding="ascii").strip()
          laravel_version = pathlib.Path("sdk/laravel/VERSION").read_text(encoding="ascii").strip()
          fixture_versions = {
              package["name"]: package["version"].removeprefix("v")
              for package in fixture_lock["packages"]
              if package["name"] in {"oxhq/pliego-php", "oxhq/pliego-laravel"}
          }
          aliases = {
              name: version
              for repository in fixture["repositories"]
              for name, version in repository["options"]["versions"].items()
          }
          release_versions = {
              "cargo-manifest": engine_version,
              "cargo-workspace-dependency": workspace["workspace"]["dependencies"]["pliego"]["version"].removeprefix("="),
              "cargo-lock": next(package["version"] for package in lock["package"] if package["name"] == "pliego"),
              "core-benchmark-manifest": benchmark["package"]["version"],
              "core-benchmark-lock": next(
                  package["version"] for package in lock["package"] if package["name"] == "pliego-core-benchmark"
              ),
              "php-version": php_version,
              "laravel-version": laravel_version,
              "laravel-php-requirement": laravel["require"]["oxhq/pliego-php"],
              "runtime-manifest": runtimes["version"],
              "fixture-php-alias": aliases["oxhq/pliego-php"],
              "fixture-laravel-alias": aliases["oxhq/pliego-laravel"],
              "fixture-laravel-requirement": fixture["require"]["oxhq/pliego-laravel"],
              "fixture-lock-php": fixture_versions["oxhq/pliego-php"],
              "fixture-lock-laravel": fixture_versions["oxhq/pliego-laravel"],
          }
          assert len(set(release_versions.values())) == 1, release_versions
          assert isinstance(runtimes.get("release_ready"), bool), "runtime manifest release state must be explicit"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"PLIEGO_ENGINE_VERSION={engine_version}\n")
              environment.write(f"PLIEGO_PHP_VERSION={php_version}\n")
              environment.write(f"PLIEGO_LARAVEL_VERSION={laravel_version}\n")
              environment.write(f"PLIEGO_RUNTIME_RELEASE_READY={str(runtimes['release_ready']).lower()}\n")
          print(f"engine/PHP: {engine_version}; Laravel: {laravel_version}")
          PY

      - name: Validate source Composer manifests strictly
        run: |
          composer --no-interaction --no-plugins --no-scripts validate --strict sdk/php/composer.json
          composer --no-interaction --no-plugins --no-scripts validate --strict sdk/laravel/composer.json
          # This reproducibility fixture deliberately exact-pins Laravel. Suppress only
          # Composer's generic over-strict-constraint warning; keep strict lock/schema checks.
          composer --no-interaction --no-plugins --no-scripts validate --strict --no-check-all --check-lock tests/pliego/laravel-invoice/composer.json

      - name: Show Composer toolchain
        run: |
          php --version
          composer --version

      - name: Run focused PHP package self-test
        run: |
          composer --no-interaction --no-plugins --no-scripts --working-dir=sdk/php install --no-progress
          composer --no-interaction --no-plugins --working-dir=sdk/php test

      - name: Run focused Laravel package self-test
        run: |
          composer --no-interaction --no-plugins --no-scripts --working-dir=tests/pliego/laravel-invoice install --no-progress
          PLIEGO_TEST_AUTOLOAD="$GITHUB_WORKSPACE/tests/pliego/laravel-invoice/vendor/autoload.php" php sdk/laravel/tests/managed_runtime_test.php
          PLIEGO_TEST_AUTOLOAD="$GITHUB_WORKSPACE/tests/pliego/laravel-invoice/vendor/autoload.php" php sdk/laravel/tests/bridge_timings_test.php

      # These are root-level package trees from the committed SDK subtrees. Public
      # repository history splits, tags, pushes, and publication stay separate.
      - name: Stage package roots
        shell: bash
        run: |
          mkdir -p dist/pliego-php dist/pliego-laravel dist/packages
          git archive --format=tar HEAD:sdk/php | tar -xf - -C dist/pliego-php
          git archive --format=tar HEAD:sdk/laravel | tar -xf - -C dist/pliego-laravel

      - name: Validate Composer manifests strictly
        run: |
          composer --no-interaction --no-plugins --no-scripts validate --strict dist/pliego-php/composer.json
          composer --no-interaction --no-plugins --no-scripts validate --strict dist/pliego-laravel/composer.json

      - name: Create Composer archives
        shell: bash
        run: |
          COMPOSER_ROOT_VERSION="$PLIEGO_PHP_VERSION" composer --no-interaction --working-dir=dist/pliego-php archive --format=zip --dir="$GITHUB_WORKSPACE/dist/packages" --file="oxhq-pliego-php-$PLIEGO_PHP_VERSION" --no-plugins --no-scripts
          COMPOSER_ROOT_VERSION="$PLIEGO_LARAVEL_VERSION" composer --no-interaction --working-dir=dist/pliego-laravel archive --format=zip --dir="$GITHUB_WORKSPACE/dist/packages" --file="oxhq-pliego-laravel-$PLIEGO_LARAVEL_VERSION" --no-plugins --no-scripts

      - name: Check package contract and archive roots
        shell: bash
        run: |
          python <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import zipfile

          root = pathlib.Path("dist")
          engine_version = os.environ["PLIEGO_ENGINE_VERSION"]
          php_version = os.environ["PLIEGO_PHP_VERSION"]
          laravel_version = os.environ["PLIEGO_LARAVEL_VERSION"]
          for version in (engine_version, php_version, laravel_version):
              assert re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", version), version

          php_root = root / "pliego-php"
          laravel_root = root / "pliego-laravel"
          php = json.loads((php_root / "composer.json").read_text(encoding="utf-8"))
          laravel = json.loads((laravel_root / "composer.json").read_text(encoding="utf-8"))
          assert php["name"] == "oxhq/pliego-php", php["name"]
          assert laravel["name"] == "oxhq/pliego-laravel", laravel["name"]
          assert php["license"] == laravel["license"] == "MIT"
          assert laravel["require"]["oxhq/pliego-php"] == php_version
          assert (php_root / "VERSION").read_text(encoding="ascii").strip() == php_version
          assert (laravel_root / "VERSION").read_text(encoding="ascii").strip() == laravel_version

          runtimes = json.loads((laravel_root / "resources" / "runtimes.json").read_text(encoding="utf-8"))
          platforms = ["linux-x86_64", "windows-x86_64", "macos-x86_64", "macos-aarch64"]
          assert runtimes["schema"] == 1
          assert runtimes["api"] == 2
          assert runtimes["version"] == engine_version
          assert runtimes["release_ready"] is (os.environ["PLIEGO_RUNTIME_RELEASE_READY"] == "true")
          assert list(runtimes["assets"]) == platforms
          for platform, asset in runtimes["assets"].items():
              assert isinstance(asset["bytes"], int) and asset["bytes"] > 0, platform
              assert re.fullmatch(r"[0-9a-f]{64}", asset["sha256"]), platform
              assert isinstance(asset["files"], list) and asset["files"], platform
              executable = "pliego.exe" if platform == "windows-x86_64" else "pliego"
              assert executable in asset["files"], platform

          archives = {
              php_root: root / "packages" / f"oxhq-pliego-php-{php_version}.zip",
              laravel_root: root / "packages" / f"oxhq-pliego-laravel-{laravel_version}.zip",
          }
          checksums = []
          for package_root, archive in archives.items():
              assert (package_root / "LICENSE").is_file()
              expected = {
                  path.relative_to(package_root).as_posix()
                  for path in package_root.rglob("*")
                  if path.is_file()
              }
              with zipfile.ZipFile(archive) as package:
                  actual = {name for name in package.namelist() if not name.endswith("/")}
              assert actual == expected, (archive, sorted(expected - actual), sorted(actual - expected))
              checksums.append(f"{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}")

          (root / "packages" / "SHA256SUMS").write_text("\n".join(checksums) + "\n", encoding="ascii")
          print("composer distribution check: ok")
          PY

      - name: Bind finalized Laravel manifest to the promoted native release
        if: env.PLIEGO_RUNTIME_RELEASE_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist/native-release
          gh release download "v$PLIEGO_ENGINE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern runtimes.json \
            --dir dist/native-release
          PLIEGO_RELEASE_RUNTIME_MANIFEST="$GITHUB_WORKSPACE/dist/native-release/runtimes.json" \
            composer --no-interaction --working-dir=dist/pliego-laravel release:check-runtime

      - name: Record non-publishable dry-run boundary
        if: env.PLIEGO_RUNTIME_RELEASE_READY != 'true'
        run: echo "Staged committed package roots and Composer ZIPs only. The Laravel archive is intentionally non-publishable until native promotion generates the exact release_ready runtime manifest; public repository history, tags, pushes, Packagist publication, and consumer installation remain unproven." >> "$GITHUB_STEP_SUMMARY"

      - name: Record finalized Composer boundary
        if: env.PLIEGO_RUNTIME_RELEASE_READY == 'true'
        run: echo "The bundled Laravel runtime manifest is byte-identical to the promoted native release asset. Public split-repository tags, Packagist publication, and consumer installation remain separate gates." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain source-only PHP dry-run artifact
        if: env.PLIEGO_RUNTIME_RELEASE_READY != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-composer-php-${{ env.PLIEGO_PHP_VERSION }}-source-only
          path: |
            dist/pliego-php/
            dist/packages/oxhq-pliego-php-${{ env.PLIEGO_PHP_VERSION }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Retain finalized Composer dry-run artifacts
        if: env.PLIEGO_RUNTIME_RELEASE_READY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-composer-${{ env.PLIEGO_LARAVEL_VERSION }}
          path: |
            dist/pliego-php/
            dist/pliego-laravel/
            dist/packages/
          if-no-files-found: error
          retention-days: 7

  framework-compatibility:
    name: Laravel ${{ matrix.framework }} / PHP ${{ matrix.php }} integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: '12'
            php: '8.3'
          - framework: '13'
            php: '8.4'
    env:
      FRAMEWORK_MAJOR: ${{ matrix.framework }}
      EXPECTED_PHP: ${{ matrix.php }}
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up the declared PHP floor
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, dom, xml, fileinfo, pdo_sqlite, zip

      - name: Prepare an isolated full-framework Composer consumer
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          source = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          consumer = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("pliego-framework-" + os.environ["FRAMEWORK_MAJOR"])
          consumer.mkdir()
          (consumer / "proof").mkdir()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("CONSUMER=" + str(consumer) + "\n")
              environment.write("PLIEGO_TEST_AUTOLOAD=" + str(consumer / "vendor/autoload.php") + "\n")
          versions = {
              name: (source / "sdk" / name / "VERSION").read_text(encoding="ascii").strip()
              for name in ("php", "laravel")
          }
          manifest = {
              "name": "pliego-proof/framework-" + os.environ["FRAMEWORK_MAJOR"],
              "type": "project",
              "require": {
                  "php": "^8.3",
                  "laravel/framework": "^" + os.environ["FRAMEWORK_MAJOR"] + ".0",
                  "oxhq/pliego-laravel": versions["laravel"],
              },
              "repositories": [
                  {"type": "path", "url": str(source / "sdk" / name),
                   "options": {"symlink": False, "versions": {"oxhq/pliego-" + name: versions[name]}}}
                  for name in ("php", "laravel")
              ],
          }
          (consumer / "composer.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=source).decode("ascii")
          (consumer / "proof/source-commit.txt").write_text(revision, encoding="ascii")
          PY

      - name: Resolve maintained framework dependencies without policy bypasses
        run: |
          set -euo pipefail
          php --version | tee "$CONSUMER/proof/php-version.txt"
          composer --version | tee "$CONSUMER/proof/composer-version.txt"
          composer --no-interaction --no-plugins --no-scripts --working-dir="$CONSUMER" \
            install --prefer-dist --no-progress 2>&1 | tee "$CONSUMER/proof/install.log"
          composer --no-interaction --no-plugins --working-dir="$CONSUMER" \
            check-platform-reqs --format=json | tee "$CONSUMER/proof/platform-requirements.json"
          composer --no-interaction --no-plugins --working-dir="$CONSUMER" \
            audit --format=json | tee "$CONSUMER/proof/audit.json"

      - name: Exercise the resolved framework and installed candidate SDKs
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib

          consumer = pathlib.Path(os.environ["CONSUMER"])
          for name in ("php", "laravel"):
              package = consumer / "vendor/oxhq" / ("pliego-" + name)
              assert package.is_dir() and not package.is_symlink(), "candidate package must be a Composer mirror"
              (package / "vendor").mkdir(exist_ok=True)
              # Test-entry-point forwarding only: dependencies and class maps
              # come from the real, already resolved consumer autoloader.
              (package / "vendor/autoload.php").write_text(
                  "<?php return require dirname(__DIR__, 3).'/autoload.php';\n", encoding="utf-8"
              )
          PY
          php "$CONSUMER/vendor/oxhq/pliego-laravel/tests/framework_compatibility_test.php" \
            | tee "$CONSUMER/proof/framework.json"
          composer --no-interaction --no-plugins --working-dir="$CONSUMER/vendor/oxhq/pliego-laravel" \
            test 2>&1 | tee "$CONSUMER/proof/laravel-tests.log"
          composer --no-interaction --no-plugins --working-dir="$CONSUMER/vendor/oxhq/pliego-php" \
            test 2>&1 | tee "$CONSUMER/proof/php-tests.log"
          python3 <<'PY'
          import json
          import os
          import pathlib

          proof = pathlib.Path(os.environ["CONSUMER"]) / "proof"
          result = json.loads((proof / "framework.json").read_text(encoding="utf-8"))
          assert result["outcome"] == "passed" and result["assertions"] >= 15, result
          assert result["native"] == "fake-api2-process", result
          assert result["framework"].split(".")[0] == os.environ["FRAMEWORK_MAJOR"], result
          assert result["php"].startswith(os.environ["EXPECTED_PHP"] + "."), result
          PY
          echo 'Real Composer/framework integration with candidate source packages and a fake API 2 process. No native PDF, public-package, or release proof.' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain resolved framework evidence and exact dependency lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-framework-${{ matrix.framework }}-php-${{ matrix.php }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pliego-framework-${{ matrix.framework }}/composer.json
            ${{ runner.temp }}/pliego-framework-${{ matrix.framework }}/composer.lock
            ${{ runner.temp }}/pliego-framework-${{ matrix.framework }}/proof/
          if-no-files-found: error
          retention-days: 30

  windows-private-job-root:
    name: Windows private API 2 job root
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out Pliego
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer --no-interaction --no-plugins --no-scripts --working-dir=sdk/php install --no-progress
      - run: composer --no-interaction --no-plugins --working-dir=sdk/php test:windows-job-root
