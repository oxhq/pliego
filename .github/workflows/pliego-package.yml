name: Pliego package matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pliego-package.yml

permissions:
  contents: read

concurrency:
  group: pliego-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            bundle: linux-x86_64
            target_dir: target
            archive_ext: tar.gz
          - name: Windows x64
            runner: windows-2022
            bundle: windows-x86_64
            target_dir: C:\a\pliego\target
            archive_ext: zip
          - name: macOS Intel
            runner: macos-15-intel
            bundle: macos-x86_64
            target_dir: target
            archive_ext: tar.gz
          - name: macOS Apple Silicon
            runner: macos-15
            bundle: macos-aarch64
            target_dir: target
            archive_ext: tar.gz
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}

    steps:
      - name: Check out Pliego
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: false

      - name: Resolve Pliego version
        shell: bash
        run: |
          python -c 'import json, os, subprocess; m=json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])); v=next(p["version"] for p in m["packages"] if p["name"] == "pliego"); open(os.environ["GITHUB_ENV"], "a", encoding="utf-8").write(f"PLIEGO_VERSION={v}\n")'

      - name: Cache Rust compilation
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"
          sudo apt-get update
          ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Configure macOS build
        if: runner.os == 'macOS'
        run: ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Configure Windows build
        if: runner.os == 'Windows'
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .\mach fetch

      - name: Build Pliego only
        run: cargo build -p pliego --locked --profile checked-release

      - name: Package and smoke-test Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bundle="pliego-${PLIEGO_VERSION}-${{ matrix.bundle }}"
          archive="${bundle}.${{ matrix.archive_ext }}"
          mkdir -p "dist/$bundle"
          cp "$CARGO_TARGET_DIR/checked-release/pliego" "dist/$bundle/pliego"
          cp LICENSE "dist/$bundle/LICENSE"
          printf '%s\n' '1. Verify the adjacent SHA-256 file.' '2. Put pliego on PATH or set PLIEGO_BINARY.' '3. Run pliego --version.' > "dist/$bundle/INSTALL.txt"
          "dist/$bundle/pliego" --version | tee "dist/$bundle/VERSION.txt"
          tar -C dist -czf "dist/$archive" "$bundle"
          python -c 'import hashlib, pathlib, sys; p = pathlib.Path(sys.argv[1]); print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")' "dist/$archive" > "dist/$archive.sha256"

      - name: Package and smoke-test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "pliego-$env:PLIEGO_VERSION-${{ matrix.bundle }}"
          $archive = "$bundle.${{ matrix.archive_ext }}"
          $directory = Join-Path dist $bundle
          New-Item -ItemType Directory -Force $directory | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\checked-release\pliego.exe" "$directory\pliego.exe"
          Copy-Item "$env:CARGO_TARGET_DIR\checked-release\libEGL.dll" "$directory\libEGL.dll"
          Copy-Item "$env:CARGO_TARGET_DIR\checked-release\libGLESv2.dll" "$directory\libGLESv2.dll"
          Copy-Item LICENSE "$directory\LICENSE"
          @('1. Verify the adjacent SHA-256 file.', '2. Put pliego.exe on PATH or set PLIEGO_BINARY.', '3. Run pliego.exe --version.') | Set-Content "$directory\INSTALL.txt" -Encoding ascii
          & "$directory\pliego.exe" --version | Tee-Object -FilePath "$directory\VERSION.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $directory -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "dist/$archive.sha256" -Encoding ascii

      - name: Upload Pliego bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-${{ matrix.bundle }}
          path: |
            dist/pliego-*.${{ matrix.archive_ext }}
            dist/pliego-*.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error
          retention-days: 7
