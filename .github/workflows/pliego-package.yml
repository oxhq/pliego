name: Pliego package matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pliego-package.yml
      - Cargo.lock
      - Cargo.toml
      - ports/pliego/**
      - python/check_pliego_release_archive.py
      - python/check_pliego_version.py
  push:
    branches:
      - "release-proof/**"

permissions:
  contents: read

concurrency:
  group: pliego-package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SERVO_BASE_SHA: "313b6d5ecc113b08010ce434140db3ca5abcc71c"

jobs:
  archive-contract:
    name: Release archive contract
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out Pliego
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Check release archive contract and source assets
        run: |
          python python/check_pliego_version.py --self-test
          python python/check_pliego_release_archive.py --self-test --check-source-assets .

  package:
    name: ${{ matrix.name }}
    needs: archive-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            bundle: linux-x86_64
            target_dir: target
            archive_ext: tar.gz
          - name: Windows x64
            runner: windows-2022
            bundle: windows-x86_64
            target_dir: C:\a\pliego\target
            archive_ext: zip
          - name: macOS Intel
            runner: macos-15-intel
            bundle: macos-x86_64
            target_dir: target
            archive_ext: tar.gz
          - name: macOS Apple Silicon
            runner: macos-15
            bundle: macos-aarch64
            target_dir: target
            archive_ext: tar.gz
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}

    steps:
      - name: Check out Pliego
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: false

      - name: Resolve package versions
        shell: bash
        run: |
          python -c 'import json, os, subprocess; m=json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"])); pliego=next(p["version"] for p in m["packages"] if p["name"] == "pliego"); servo=next(p["version"] for p in m["packages"] if p["name"] == "servo"); open(os.environ["GITHUB_ENV"], "a", encoding="utf-8").write(f"PLIEGO_VERSION={pliego}\nSERVO_VERSION={servo}\n")'

      - name: Cache Rust compilation
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"
          sudo apt-get update
          ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Configure macOS build
        if: runner.os == 'macOS'
        run: ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Configure Windows build
        if: runner.os == 'Windows'
        run: |
          @("LIBCLANG_PATH=C:\Program Files\LLVM\bin", "CC=clang-cl.exe", "CXX=clang-cl.exe") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .\mach fetch

      - name: Check production dependency boundary
        shell: bash
        run: |
          tree="$(cargo tree -p pliego --edges normal --prefix none --locked)"
          printf '%s\n' "$tree"
          grep -Eq '^servo v[0-9]' <<< "$tree"
          if grep -Eq '^servoshell v[0-9]' <<< "$tree"; then
            echo 'default package graph pulled in the nonproduction shell oracle' >&2
            exit 1
          fi

      - name: Build Pliego only
        run: cargo build -p pliego --locked --profile checked-release

      - name: Test native PDF publication primitives
        shell: bash
        run: |
          set -euo pipefail
          selected_tests="$({
            cargo test -p pliego --bin pliego --locked --profile checked-release \
              session::tests:: -- --list --skip document_session::tests::
          } | awk 'sub(/: test$/, "") { print }')"
          native_test_count="$(printf '%s\n' "$selected_tests" | awk '/^session::tests::/ { count++ } END { print count + 0 }')"
          if [[ "$native_test_count" -lt 1 ]]; then
            echo '::error::No native session::tests:: publication tests were selected.'
            exit 1
          fi
          unexpected_tests="$(printf '%s\n' "$selected_tests" | awk 'NF && $0 !~ /^session::tests::/ { print }')"
          if [[ -n "$unexpected_tests" ]]; then
            echo '::error::The native publication filter selected tests outside session::tests::.'
            printf '%s\n' "$unexpected_tests"
            exit 1
          fi
          cargo test -p pliego --bin pliego --locked --profile checked-release \
            session::tests:: -- --skip document_session::tests::

      - name: Package and smoke-test Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bundle="pliego-${PLIEGO_VERSION}-${{ matrix.bundle }}"
          archive="${bundle}.${{ matrix.archive_ext }}"
          mkdir -p "dist/$bundle"
          cp "$CARGO_TARGET_DIR/checked-release/pliego" "dist/$bundle/pliego"
          cp LICENSE "dist/$bundle/LICENSE"
          cp LICENSE_WHATWG_SPECS "dist/$bundle/LICENSE_WHATWG_SPECS"
          cp resources/resource_protocol/license.html "dist/$bundle/THIRD_PARTY_LICENSES.html"
          cp docs/pliego/third-party-notices.md "dist/$bundle/THIRD_PARTY_NOTICES.md"
          mkdir -p "dist/$bundle/licenses"
          cp -R licenses/krilla-0.8.2 "dist/$bundle/licenses/krilla-0.8.2"
          printf 'Repository: %s/%s\nSource: %s/%s/tree/v%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PLIEGO_VERSION" > "dist/$bundle/SOURCE.txt"
          python python/check_pliego_release_archive.py --native-inventory '${{ matrix.bundle }}' > "dist/$bundle/NATIVE-LIBRARIES.txt"
          printf '%s\n' '1. Verify the adjacent SHA-256 file.' '2. Put pliego on PATH or set PLIEGO_BINARY.' '3. Run pliego --version.' > "dist/$bundle/INSTALL.txt"
          revision="$(git rev-parse --short HEAD)"
          help_stdout="$RUNNER_TEMP/pliego-help-${{ matrix.bundle }}.txt"
          "dist/$bundle/pliego" --help > "$help_stdout"
          grep -F 'Runtime: document-session' "$help_stdout"
          if grep -F 'NONPRODUCTION ORACLE BUILD' "$help_stdout"; then
            echo 'release bundle contains the nonproduction shell oracle' >&2
            exit 1
          fi
          version_stderr="$RUNNER_TEMP/pliego-version-${{ matrix.bundle }}.stderr"
          "dist/$bundle/pliego" --version 2>"$version_stderr" | tee "dist/$bundle/VERSION.txt"
          if [[ -s "$version_stderr" ]]; then
            echo 'pliego --version must not write to stderr' >&2
            cat "$version_stderr" >&2
            exit 1
          fi
          python python/check_pliego_version.py "dist/$bundle/VERSION.txt" --pliego-version "$PLIEGO_VERSION" --servo-version "$SERVO_VERSION" --git-sha "$revision" --servo-base-sha "$SERVO_BASE_SHA"
          tar -C dist -czf "dist/$archive" "$bundle"
          python python/check_pliego_release_archive.py "dist/$archive" --version "$PLIEGO_VERSION" --bundle '${{ matrix.bundle }}' --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --servo-version "$SERVO_VERSION" --git-sha "$revision" --servo-base-sha "$SERVO_BASE_SHA"
          python -c 'import hashlib, pathlib, sys; p = pathlib.Path(sys.argv[1]); print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")' "dist/$archive" > "dist/$archive.sha256"

      - name: Package and smoke-test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "pliego-$env:PLIEGO_VERSION-${{ matrix.bundle }}"
          $archive = "$bundle.${{ matrix.archive_ext }}"
          $directory = Join-Path dist $bundle
          New-Item -ItemType Directory -Force $directory | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\checked-release\pliego.exe" "$directory\pliego.exe"
          foreach ($dll in @('libEGL.dll', 'libGLESv2.dll')) {
            $source = Get-ChildItem "$env:CARGO_TARGET_DIR\checked-release\build" -Filter $dll -Recurse | Select-Object -First 1
            if (-not $source) { throw "$dll was not produced" }
            Copy-Item $source.FullName "$directory\$dll"
          }
          Copy-Item LICENSE "$directory\LICENSE"
          Copy-Item LICENSE_WHATWG_SPECS "$directory\LICENSE_WHATWG_SPECS"
          Copy-Item resources\resource_protocol\license.html "$directory\THIRD_PARTY_LICENSES.html"
          Copy-Item docs\pliego\third-party-notices.md "$directory\THIRD_PARTY_NOTICES.md"
          $licenses = Join-Path $directory licenses
          New-Item -ItemType Directory -Force $licenses | Out-Null
          Copy-Item -LiteralPath licenses\krilla-0.8.2 -Destination $licenses -Recurse
          Copy-Item -LiteralPath licenses\mozangle-0.6.0 -Destination $licenses -Recurse
          Copy-Item -LiteralPath licenses\zlib-1.3.2 -Destination $licenses -Recurse
          @("Repository: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY", "Source: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/v$env:PLIEGO_VERSION") | Set-Content "$directory\SOURCE.txt" -Encoding utf8
          python python/check_pliego_release_archive.py --native-inventory '${{ matrix.bundle }}' | Set-Content "$directory\NATIVE-LIBRARIES.txt" -Encoding utf8
          @('1. Verify the adjacent SHA-256 file.', '2. Put pliego.exe on PATH or set PLIEGO_BINARY.', '3. Run pliego.exe --version.') | Set-Content "$directory\INSTALL.txt" -Encoding ascii
          $revision = git rev-parse --short HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $help = (& "$directory\pliego.exe" --help | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $help.Contains('Runtime: document-session')) {
            throw 'release bundle did not select the document-session runtime'
          }
          if ($help.Contains('NONPRODUCTION ORACLE BUILD')) {
            throw 'release bundle contains the nonproduction shell oracle'
          }
          $llvmReadObj = Join-Path $env:LIBCLANG_PATH 'llvm-readobj.exe'
          if (-not (Test-Path -LiteralPath $llvmReadObj -PathType Leaf)) {
            throw "LLVM PE reader does not exist: $llvmReadObj"
          }
          $exports = (& $llvmReadObj --coff-exports "$directory\pliego.exe" | Out-String)
          $readObjExitCode = $LASTEXITCODE
          if ($readObjExitCode -ne 0) {
            throw "llvm-readobj failed with exit code $readObjExitCode"
          }
          $exports | Write-Output
          $exportNames = @(
            $exports -split "`r?`n" | ForEach-Object {
              if ($_ -cmatch '^\s*Name:\s+(\S+)\s*$') { $Matches[1] }
            }
          )
          foreach ($symbol in @('NvOptimusEnablement', 'AmdPowerXpressRequestHighPerformance')) {
            $count = @($exportNames | Where-Object { $_ -ceq $symbol }).Count
            if ($count -ne 1) {
              throw "release bundle export table contains $count exact entries for GPU selection symbol $symbol"
            }
          }
          if ($exportNames -ccontains '_SURFMAN_LINK_ARGS') {
            throw 'release bundle unexpectedly exports _SURFMAN_LINK_ARGS'
          }
          $versionStderr = Join-Path $env:RUNNER_TEMP 'pliego-version-${{ matrix.bundle }}.stderr'
          & "$directory\pliego.exe" --version 2> $versionStderr | Tee-Object -FilePath "$directory\VERSION.txt"
          $versionExitCode = $LASTEXITCODE
          if ($versionExitCode -ne 0) {
            Get-Content -LiteralPath $versionStderr | Write-Error
            exit $versionExitCode
          }
          if ((Get-Item -LiteralPath $versionStderr).Length -ne 0) {
            $versionError = [System.IO.File]::ReadAllText($versionStderr)
            throw "pliego.exe --version must not write to stderr: $versionError"
          }
          python python/check_pliego_version.py "$directory\VERSION.txt" --pliego-version "$env:PLIEGO_VERSION" --servo-version "$env:SERVO_VERSION" --git-sha "$revision" --servo-base-sha "$env:SERVO_BASE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $directory -DestinationPath "dist/$archive"
          python python/check_pliego_release_archive.py "dist/$archive" --version "$env:PLIEGO_VERSION" --bundle '${{ matrix.bundle }}' --repository-url "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" --servo-version "$env:SERVO_VERSION" --git-sha "$revision" --servo-base-sha "$env:SERVO_BASE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "dist/$archive.sha256" -Encoding ascii

      - name: Upload Pliego bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-${{ matrix.bundle }}
          path: |
            dist/pliego-*.${{ matrix.archive_ext }}
            dist/pliego-*.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error
          retention-days: 7
