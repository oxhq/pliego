name: Pliego historical invoice reference diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Cache Rust compilation
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Prefer the main Ubuntu mirror
        uses: ./.github/actions/apt-mirrors

      - name: Bootstrap Linux dependencies
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-dev poppler-utils
          libclang="$(find /usr/lib/llvm-* -maxdepth 2 \( -type f -o -type l \) -name libclang.so -print | sort --version-sort | tail -n 1)"
          test -n "$libclang"
          test -r "$libclang"
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          ./mach bootstrap --yes --skip-lints --skip-nextest

      - name: Retain the unchanged 8938 invoice render and verify its historical hashes
        env:
          PLIEGO_INVOICE_ORACLE_EVIDENCE_ROOT: ${{ runner.temp }}/pliego-invoice-oracle
        run: |
          cargo test -p pliego --test document_session --locked \
            document_session::tests::resource_and_readiness_fixtures_are_evidenced_and_fail_closed \
            -- --exact --nocapture

      - name: Retain exact historical scene and PDF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pliego-historical-invoice-oracle
          path: ${{ runner.temp }}/pliego-invoice-oracle
          if-no-files-found: error
          retention-days: 30
