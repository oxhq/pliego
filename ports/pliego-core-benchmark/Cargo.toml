[package]
name = "pliego-core-benchmark"
version = "0.3.1"
authors = ["OxHQ"]
license = "MPL-2.0"
edition.workspace = true
publish = false
rust-version = "1.92"
description = "Binless runner for Pliego's runtime-free core PDF benchmark"
# Cargo builds a package's binaries before its benches to provide
# CARGO_BIN_EXE_* variables. Keep this runner binless so the benchmark can use
# Pliego's core library without selecting a production runtime for the CLI.
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bench]]
name = "document_scene_pdf"
path = "../pliego/benches/document_scene_pdf.rs"
harness = false

[dependencies]
pliego = { workspace = true, default-features = false }

[dev-dependencies]
criterion = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
ttf-parser = { workspace = true }
