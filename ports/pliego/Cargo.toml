[package]
name = "pliego"
version = "0.4.0"
authors = ["OxHQ"]
license = "MPL-2.0"
edition.workspace = true
publish = false
rust-version = "1.92"
repository = "https://github.com/oxhq/pliego"
description = "Native document rendering entrypoint built on Servo"

[lib]
path = "src/scene.rs"

[features]
default = ["document-session"]
document-session = [
    "dep:data-url",
    "dep:dpi",
    "dep:image",
    "dep:layout",
    "dep:servo",
    "dep:servo-geometry",
    "dep:surfman",
    "servo/js_jit",
]
shell-oracle = ["dep:layout", "dep:servoshell", "servoshell/js_jit"]
# Compatibility for callers that explicitly selected the pre-cutover feature.
# It remains opt-in and never enters the default production dependency graph.
shell = ["shell-oracle"]

[[bin]]
name = "pliego"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
data-url = { workspace = true, optional = true }
dpi = { workspace = true, optional = true }
embedder_traits = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
imagesize = "0.14.0"
image = { workspace = true, default-features = false, features = ["png"], optional = true }
libc = { workspace = true }
rand = { workspace = true }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
layout = { workspace = true, optional = true }
net = { workspace = true }
same-file = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
servo-canvas = { workspace = true }
servo = { workspace = true, default-features = false, features = ["baked-in-resources", "bundled_freetype"], optional = true }
servoshell = { workspace = true, features = ["baked-in-resources", "bundled_freetype"], optional = true }
surfman = { workspace = true, optional = true }
servo-geometry = { workspace = true, optional = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["time"] }
timers = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
vello_cpu = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
crossbeam-channel = { workspace = true }
flate2 = { workspace = true }
servo-base = { workspace = true }
servo-canvas = { workspace = true, features = ["document-session-testing"] }
toml_edit = { version = "=0.25.12", default-features = false, features = ["parse"] }
ttf-parser = { workspace = true }

[build-dependencies]
toml_edit = { version = "=0.25.12", default-features = false, features = ["parse"] }

[target.'cfg(windows)'.dependencies]
# The direct renderer owns Servo's Windows graphics backend after the
# servoshell cutover. Match Servo's supported Windows embedding path: WGL does
# not provide a usable headless context on CI or all production hosts.
servo = { workspace = true, features = ["no-wgl"], optional = true }
windows-sys = { workspace = true, features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bench]]
name = "document_scene_pdf"
harness = false

[[test]]
name = "document_session"
required-features = ["document-session"]
