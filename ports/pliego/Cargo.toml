[package]
name = "pliego"
version = "0.1.1"
authors = ["OxHQ"]
license = "MPL-2.0"
edition.workspace = true
publish = false
rust-version = "1.92"
repository = "https://github.com/oxhq/pliego"
description = "Native document rendering entrypoint built on Servo"

[lib]
path = "src/scene.rs"

[features]
default = ["shell"]
document-session = ["dep:data-url", "dep:dpi", "dep:layout", "dep:servo"]
shell = ["dep:layout", "dep:servoshell"]

[[bin]]
name = "pliego"
path = "src/main.rs"
required-features = ["shell"]

[dependencies]
base64 = { workspace = true }
data-url = { workspace = true, optional = true }
dpi = { workspace = true, optional = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
imagesize = "0.14.0"
libc = { workspace = true }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
layout = { workspace = true, optional = true }
net = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
servo-canvas = { workspace = true }
servo = { workspace = true, default-features = false, features = ["baked-in-resources", "bundled_freetype"], optional = true }
servoshell = { workspace = true, features = ["baked-in-resources", "bundled_freetype"], optional = true }
tokio = { workspace = true, features = ["time"] }
unicode-segmentation = { workspace = true }
url = { workspace = true }
vello_cpu = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
flate2 = { workspace = true }
servo-canvas = { workspace = true, features = ["document-session-testing"] }
ttf-parser = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[bench]]
name = "document_scene_pdf"
harness = false

[[test]]
name = "document_session"
required-features = ["document-session"]
