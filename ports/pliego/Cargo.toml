[package]
name = "pliego"
version = "0.1.0"
authors = ["OxHQ"]
license = "MPL-2.0"
edition.workspace = true
publish = false
rust-version = "1.92"
repository = "https://github.com/oxhq/pliego"
description = "Native document rendering entrypoint built on Servo"

[lib]
path = "src/scene.rs"

[dependencies]
base64 = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
imagesize = "0.14.0"
libc = { workspace = true }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
layout = { workspace = true }
net = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
servo-canvas = { workspace = true }
servoshell = { path = "../servoshell", default-features = false, features = ["baked-in-resources", "bundled_freetype"] }
tokio = { workspace = true, features = ["time"] }
unicode-segmentation = { workspace = true }
url = { workspace = true }
vello_cpu = { workspace = true }

[dev-dependencies]
flate2 = { workspace = true }
ttf-parser = { workspace = true }
