[package]
name = "pliego"
version = "0.1.0"
authors = ["OxHQ"]
license = "MPL-2.0"
edition.workspace = true
publish = false
rust-version.workspace = true
repository = "https://github.com/oxhq/pliego"
description = "Native document rendering entrypoint built on Servo"

[lib]
path = "src/scene.rs"

[dependencies]
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
servoshell = { path = "../servoshell" }
url = { workspace = true }
vello_cpu = { workspace = true }
