<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pliego synthetic invoice gate</title>
    <style>
      @font-face {
        font-family: Ahem;
        src: url("../text-scene/Ahem.ttf");
      }
      html, body { margin: 0; }
      body { font: 12px/16px Ahem; }
      table {
        border-collapse: collapse;
        table-layout: fixed;
        width: 540px;
      }
      caption { height: 32px; text-align: left; }
      th, td {
        border: 1px solid #243447;
        box-sizing: border-box;
        padding: 4px;
        text-align: left;
      }
      thead tr { height: 32px; }
      tbody tr { height: 36px; }
      tfoot tr { height: 40px; }
      th:nth-child(1), td:nth-child(1) { width: 96px; }
      th:nth-child(2), td:nth-child(2) { width: 72px; }
      th:nth-child(3), td:nth-child(3) { width: 276px; }
      th:nth-child(4), td:nth-child(4) { width: 96px; }
      .page-end { break-after: page; }
    </style>
  </head>
  <body>
    <table id="invoice">
      <caption>INVOICE PLG-2026-001</caption>
      <thead>
        <tr><th>ITEM</th><th>QTY</th><th>DESCRIPTION</th><th>AMOUNT</th></tr>
      </thead>
      <tbody id="items"></tbody>
      <tfoot>
        <tr><td>TOTAL</td><td>32</td><td>MXN</td><td>5280.00</td></tr>
      </tfoot>
    </table>
    <script>
      const body = document.querySelector("#items");
      for (let row = 1; row <= 32; row++) {
        const item = document.createElement("tr");
        if (row === 16) item.className = "page-end";
        const id = `INV-${String(row).padStart(3, "0")}`;
        for (const value of [id, "1", `SERVICE-${String(row).padStart(3, "0")}`, `${row * 10}.00`]) {
          const cell = document.createElement("td");
          cell.textContent = value;
          item.append(cell);
        }
        body.append(item);
      }
      queueMicrotask(() => window.pliego?.ready({
        fixture: "invoice",
        rows: 32,
        expected_pages: 2
      }));
    </script>
  </body>
</html>
