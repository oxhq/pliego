<!doctype html>
<meta charset="utf-8">
<style>canvas { width: 10px; height: 10px; }</style>
<canvas id="target" width="2" height="2"></canvas>
<canvas id="donor" width="2" height="2"></canvas>
<script>
  const donor = document.querySelector("#donor").getContext("2d");
  const target = document.querySelector("#target").getContext("2d");
  for (let index = 0; index < 2; index += 1) {
    donor.getImageData(0, 0, 1, 1);
  }
  target.getImageData(0, 0, 1, 1);
  window.pliego.ready({ fixture: "canvas-retention-budget" });
</script>
