<!doctype html>
<meta charset="utf-8">
<script>
  window.name = "pliego-seed-page";
  addEventListener("message", (event) => {
    if (event.origin === new URL("__BASE_URL__").origin) {
      document.querySelector("iframe").remove();
      window.pliego.ready({
        iframe_cookie_persisted: event.data.iframe_cookie_persisted,
        window_name: window.name,
      });
    }
  });
</script>
<iframe hidden src="__BASE_URL__seed-frame.html"></iframe>
<div style="width: 96px; height: 48px; background: #345"></div>
