<!doctype html>
<meta charset="utf-8">
<script>
  addEventListener("message", (event) => {
    if (event.origin === new URL("__BASE_URL__").origin) {
      document.querySelector("iframe").remove();
      window.pliego.ready({
        iframe_cookie_present: event.data.iframe_cookie_present,
        cookie_header_seen: event.data.cookie_header_seen,
        window_name: window.name,
      });
    }
  });
</script>
<iframe hidden src="__BASE_URL__clean-frame.html"></iframe>
<div style="width: 96px; height: 48px; background: #345"></div>
