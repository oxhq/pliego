<!doctype html>
<meta charset="utf-8">
<canvas id="chart" width="16" height="12"></canvas>
<script>
  const context = document.querySelector("#chart").getContext("2d");
  context.translate(1, 0);
  context.fillRect(1, 1, 5, 5);
  window.pliego.ready({ fixture: "unsupported-canvas" });
</script>
