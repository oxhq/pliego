<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pliego combined paged layout CI fixture</title>
    <style>
      @font-face {
        font-family: "Pliego Fixture";
        src: url("Ahem.ttf");
      }

      html,
      body,
      p {
        margin: 0;
      }

      body {
        font: 16px/20px "Pliego Fixture";
      }

      .natural {
        height: 40px;
        white-space: nowrap;
      }

      #forced-paragraph {
        break-before: page;
      }

      #kept {
        break-inside: avoid;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <div class="natural" data-source>Alpha.</div>
    <div class="natural" data-source>Beta.</div>
    <p id="forced-paragraph" data-source>aaaaaaaaa bbbbbbbbb ccccccccc ddddddddd eeeeeeeee fffffffff ggggggggg hhhhhhhhh iiiiiiiii</p>
    <div id="kept" data-source>Kept together.</div>
    <script>
      window.pliego?.defer();
      queueMicrotask(async () => {
        try {
          await document.fonts.ready;
          const source = [...document.querySelectorAll('[data-source]')]
            .map((node) => node.textContent)
            .join(' ');
          window.pliego?.ready({ fixture: 'paged-ci', source });
        } catch (error) {
          window.pliego?.fail({
            code: 'FIXTURE_FONT_LOAD_FAILED',
            message: String(error),
          });
        }
      });
    </script>
  </body>
</html>
