<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pliego deterministic font resolution fixture</title>
    <style>
      @font-face {
        font-family: "Pliego Fixture";
        src: url("data:font/ttf;base64,__PLIEGO_FONT_BASE64__");
      }

      body {
        font-family: "Missing Preferred", "Pliego Fixture";
        font-size: 12px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <p>PLIEGO FONT FALLBACK</p>
    <script>
      window.pliego?.defer();
      queueMicrotask(async () => {
        try {
          for (let attempt = 0; !window.pliego && attempt < 120; attempt += 1) {
            await new Promise(requestAnimationFrame);
          }
          if (!window.pliego) throw new Error('Pliego bridge was not installed');
          let fontLaidOut = false;
          for (let attempt = 0; !fontLaidOut && attempt < 200; attempt += 1) {
            const rect = document.querySelector('p').getBoundingClientRect();
            fontLaidOut = rect.width > 0 && rect.height > 0;
            if (!fontLaidOut) {
              await new Promise(resolve => setTimeout(resolve, 25));
            }
          }
          if (!fontLaidOut) throw new Error('Pliego Fixture did not produce text geometry');
          await new Promise(requestAnimationFrame);
          await new Promise(requestAnimationFrame);
          window.pliego.ready({ fixture: 'font-resolution' });
        } catch (error) {
          window.pliego?.fail({
            code: 'FIXTURE_FONT_LOAD_FAILED',
            message: String(error),
          });
        }
      });
    </script>
  </body>
</html>
