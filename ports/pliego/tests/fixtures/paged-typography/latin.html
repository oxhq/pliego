<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pliego paged Latin control</title>
    <style>
      @font-face {
        font-family: "Ahem";
        src: url("data:font/ttf;base64,__PLIEGO_FONT_BASE64__");
      }

      html,
      body,
      p {
        margin: 0;
      }

      body {
        font: 16px/20px "Ahem";
      }
    </style>
  </head>
  <body>
    <p>LATIN CONTROL LATIN CONTROL LATIN CONTROL LATIN CONTROL LATIN CONTROL LATIN CONTROL LATIN CONTROL LATIN CONTROL</p>
    <script>
      window.pliego?.defer();
      queueMicrotask(async () => {
        try {
          for (let attempt = 0; !window.pliego && attempt < 120; attempt += 1) {
            await new Promise(requestAnimationFrame);
          }
          if (!window.pliego) throw new Error('Pliego bridge was not installed');
          let laidOut = false;
          for (let attempt = 0; !laidOut && attempt < 200; attempt += 1) {
            const bounds = document.querySelector('p').getBoundingClientRect();
            laidOut = bounds.width > 0 && bounds.height > 0;
            if (!laidOut) await new Promise(resolve => setTimeout(resolve, 25));
          }
          if (!laidOut) {
            window.pliego.fail({
              code: 'FIXTURE_FONT_LAYOUT_TIMEOUT',
              message: 'Latin paragraph did not obtain positive layout bounds',
            });
            return;
          }
          await new Promise(requestAnimationFrame);
          await new Promise(requestAnimationFrame);
          window.pliego.ready({ fixture: 'paged-typography-latin' });
        } catch (error) {
          window.pliego?.fail({
            code: 'FIXTURE_FONT_CAPTURE_FAILED',
            message: String(error),
          });
        }
      });
    </script>
  </body>
</html>
