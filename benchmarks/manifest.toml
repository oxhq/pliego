# Pliego benchmark manifest — single source of truth for the benchmark harness.
# Paths in `input` and `prepare` are relative to the repository root.

schema = "pliego.benchmark-manifest"
version = 1

[protocol]
binary_profile = "checked-release"
network = "disabled"
warmup_iterations = 10
samples_short = 50
samples_long = 20
sample_order = "random"
seed = 1

[oracle]
contract = "pliego.pdf-oracle.v1"
# Publishable results require canonical path, SHA-256, and version pins for
# pdfinfo, pdftotext, pdffonts, and pdftoppm. They are deliberately absent until
# the dedicated Linux oracle runtime is frozen; current numeric results are N/A.

[targets."pliego-0.2.0"]
label = "Pliego 0.2.0 (published bundle)"
version = "0.2.0"
enabled = true
kind = "pliego"
repository = "https://github.com/oxhq/pliego"
release_tag = "v0.2.0"
commit = "556c774242b272b11bc60999449c5debff1ad20f"
servo_build = "0.4.0-556c77424"
servo_base = "313b6d5ecc113b08010ce434140db3ca5abcc71c"
runtime_manifest = "benchmarks/releases/v0.2.0/runtimes.json"
runtime_manifest_bytes = 3290
runtime_manifest_sha256 = "47d2fe59efe4439fefd1d30e2c8604c776829170bd8cb44d0e5764ed70b9e32d"
platform = "linux-x86_64"
profile = "checked-release"
archive = "pliego-0.2.0-linux-x86_64.tar.gz"
archive_bytes = 62808123
archive_sha256 = "c01e60c61f8fac02d7c1631cfe461a4c7e4a2ff8aaa1149e26d629f55146e26b"
binary = "pliego"
binary_bytes = 197207424
binary_sha256 = "36fa5c2413e48ad3a21296b9f2c67b8a292fdcfc67b75e07299eb830774a16f0"

[targets."dompdf-3.1.6"]
label = "dompdf 3.1.6 (cold Composer adapter)"
version = "3.1.6"
enabled = true
kind = "adapter"
package = "dompdf/dompdf"
adapter = "benchmarks/adapters/dompdf/adapter.php"
profile = "composer-lock-cold-one-shot"
lockfiles = ["benchmarks/adapters/dompdf/composer.lock"]
identity_keys = ["composer_vendor_sha256"]
# Publishable adapter numbers stay N/A until this target pins an immutable OCI
# image digest plus canonical dependency/runtime hashes and paths. A lock file
# plus a mutable vendor tree is not image identity.
runtime_identity_contract = "pliego.benchmark-runtime-image.v1"
runtime_attestation = "unavailable"
supported_fixtures = ["minimal-static"]
unsupported_reason = "adapter contract v1 has no verified correctness mapping for this fixture"

[targets."dompdf-3.1.6".not_applicable]
chartjs-showcase = "dynamic Canvas fixture is outside the verified static adapter slice"
invoice-showcase = "invoice pagination has not passed the shared cross-target oracle"
ledger-20-pages = "scale pagination has not passed the shared cross-target oracle"
statement-100-pages = "scale pagination has not passed the shared cross-target oracle"
font-image-heavy = "resource-heavy rendering has not passed the shared cross-target oracle"
unsupported-paint = "Pliego-specific typed fail-closed paint behavior is not a comparable dompdf outcome"

[targets."browsershot-5.4.0-puppeteer-25.8.0"]
label = "Browsershot 5.4.0 + Puppeteer 25.8.0 (cold Chromium adapter)"
version = "5.4.0"
enabled = true
kind = "adapter"
package = "spatie/browsershot"
adapter = "benchmarks/adapters/browsershot/adapter.php"
profile = "composer-npm-lock-cold-one-shot"
lockfiles = [
    "benchmarks/adapters/browsershot/composer.lock",
    "benchmarks/adapters/browsershot/package-lock.json",
]
identity_keys = ["composer_vendor_sha256", "node_modules_sha256"]
runtime_identity_contract = "pliego.benchmark-runtime-image.v1"
runtime_attestation = "unavailable"
requires_network_isolation = true
supported_fixtures = ["minimal-static"]
unsupported_reason = "adapter contract v1 has no verified correctness mapping for this fixture"

[targets."browsershot-5.4.0-puppeteer-25.8.0".not_applicable]
chartjs-showcase = "dynamic Canvas fixture is outside the verified static adapter slice"
invoice-showcase = "invoice pagination has not passed the shared cross-target oracle"
ledger-20-pages = "scale pagination has not passed the shared cross-target oracle"
statement-100-pages = "scale pagination has not passed the shared cross-target oracle"
font-image-heavy = "resource-heavy rendering has not passed the shared cross-target oracle"
unsupported-paint = "Pliego-specific typed fail-closed paint behavior is not a comparable Browsershot outcome"

[targets."pliego-1.0.0-rc.1"]
label = "Pliego 1.0.0-rc.1 (document runtime)"
version = "1.0.0-rc.1"
enabled = false

[fixtures.minimal-static]
purpose = "pure startup: one small page, one bundled font, no scripts or images"
category = "static"
samples = 50
input = "benchmarks/fixtures/minimal-static/input.html"
assets = ["Ahem.ttf"]
page_size = "793.7008x1122.52"
page_margins = "0,0,0,0"

[fixtures.minimal-static.correctness]
page_count = 1
page_width_points = 595.276
page_height_points = 841.89
# Chromium quantizes custom paper sizes to its print grid. Keep one A4 oracle
# for every target while allowing less than 0.27 mm of engine rounding.
dimension_tolerance_points = 0.75
text_contains = ["Minimal"]
text_equals = "Minimal Hello, Pliego. This fixture measures pure startup: one small page, one bundled font, no scripts or images."
font_families = ["Ahem"]
normalized_raster_sha256 = "0f9edcf2b796a110d1a68efed00ce684921fec9ff7b52ccdc68bb718d1b93444"
link_targets = ["https://pliego.dev/docs"]

[fixtures.invoice-showcase]
purpose = "two-page invoice: Ahem font, paged table, totals, authored page break"
category = "static"
samples = 50
input = "benchmarks/fixtures/invoice-showcase/input.html"
assets = ["Ahem.ttf"]

[fixtures.invoice-showcase.correctness]
page_count = 2
text_contains = ["INVOICE PLG-2026-001", "TOTAL", "5280.00"]

[fixtures.chartjs-showcase]
purpose = "Chart.js 4.5.1 canvas readback and readiness (managed reference)"
category = "scripted"
samples = 50
input = "ports/pliego/tests/fixtures/chartjs-report/index.html"
assets = ["ReportSans.ttf", "node_modules/chart.js/dist/chart.umd.js"]
prepare = [
    "npm ci (in ports/pliego/tests/fixtures/chartjs-report)",
    "copy DejaVuSans.ttf to ReportSans.ttf in ports/pliego/tests/fixtures/chartjs-report",
]

[fixtures.chartjs-showcase.correctness]
page_count = 1
text_contains = ["Northstar Operations", "Account contribution"]

[fixtures.ledger-20-pages]
purpose = "fragmentation and repeated headers at ~20 pages"
category = "scale"
samples = 20
input = "benchmarks/fixtures/ledger-20-pages/input.html"
assets = ["Ahem.ttf"]
generated = true

[fixtures.ledger-20-pages.correctness]
page_count = 20
text_contains = ["LEDGER PLG-2026-01", "REF-000250"]

[fixtures.statement-100-pages]
purpose = "100-page statement: scaling, memory, per-page cost"
category = "scale"
samples = 20
input = "benchmarks/fixtures/statement-100-pages/input.html"
assets = ["Ahem.ttf"]
generated = true

[fixtures.statement-100-pages.correctness]
page_count = 100
text_contains = ["STATEMENT PLG-2026-01", "REF-001300"]

[fixtures.font-image-heavy]
purpose = "font embedding, image decode, resources and I/O"
category = "resources"
samples = 20
input = "benchmarks/fixtures/font-image-heavy/input.html"
assets = ["Ahem.ttf"]
generated = true

[fixtures.font-image-heavy.correctness]
page_count = 6
text_contains = ["Font and image heavy"]

[fixtures.unsupported-paint]
purpose = "fail-closed path for unsupported CSS paint (gradient, shadow, radius)"
category = "failure"
samples = 20
input = "benchmarks/fixtures/unsupported-paint/input.html"
expect_failure = true

[fixtures.unsupported-paint.correctness]
failure_code = "SCENE_CAPTURE_UNSUPPORTED_PAINT_EVENTS"
pdf_published = false
