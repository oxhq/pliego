<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Minimal static</title>
    <style>
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      html, body { margin: 0; }
      body {
        color: #111;
        font: 12px/16px Ahem;
        padding: 24px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0; }
      a { color: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <h1>Minimal</h1>
    <p><a href="https://pliego.dev/docs">Hello, Pliego.</a> This fixture measures pure startup: one small page, one bundled font, no scripts or images.</p>
  </body>
</html>
