<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Minimal static</title>
    <style>
      @font-face {
        font-family: Ahem;
        src: url("Ahem.ttf");
      }
      html, body { margin: 0; }
      body {
        color: #111;
        font-family: Ahem;
        font-size: 12px;
        font-style: normal;
        font-weight: 400;
        line-height: 16px;
        padding: 24px;
      }
      h1 {
        font-family: Ahem;
        font-size: 20px;
        font-style: normal;
        font-weight: 400;
        line-height: 24px;
        margin: 0 0 8px;
      }
      p { font-size: 8px; line-height: 12px; margin: 0 0 4px; }
      a { color: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <h1>Minimal</h1>
    <p><a href="https://pliego.dev/docs">Hello, Pliego.</a> This fixture measures pure startup:</p>
    <p>one small page, one bundled font, no scripts or images.</p>
  </body>
</html>
