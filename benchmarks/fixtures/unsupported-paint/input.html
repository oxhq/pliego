<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Unsupported paint</title>
    <style>
      html, body { margin: 0; }
      body { font: 12px/16px sans-serif; padding: 24px; color: #111; }
      .gradient { background: linear-gradient(180deg, #ffffff, #0369a1); }
      .shadow { box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }
      .rounded { border: 2px solid #0369a1; border-radius: 8px; }
      .card { height: 64px; margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <h1>Unsupported paint</h1>
    <p>Every element below uses CSS paint outside the Pliego 0.1 support
    profile. The default path must fail closed with a typed error and publish
    no PDF.</p>
    <div class="card gradient">CSS gradient</div>
    <div class="card shadow">Box shadow</div>
    <div class="card rounded">Rounded border</div>
  </body>
</html>
