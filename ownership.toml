# Rules are evaluated in order; the last matching rule wins.

[[path]]
pattern = "components/script/**"
ownership = "upstream"

[[path]]
pattern = "components/constellation/**"
ownership = "upstream"

[[path]]
pattern = "components/servo/**"
ownership = "upstream"

[[path]]
pattern = "components/shared/**"
ownership = "shared"

[[path]]
pattern = "components/layout/**"
ownership = "shared"

[[path]]
pattern = "components/layout/fragmentation/**"
ownership = "pliego"

[[path]]
pattern = "components/layout/pages/**"
ownership = "pliego"

[[path]]
pattern = "components/document_*/**"
ownership = "pliego"

[[path]]
pattern = ".github/workflows/pliego-*"
ownership = "pliego"

[[path]]
pattern = "PULL_REQUEST_TEMPLATE.md"
ownership = "pliego"

[[path]]
pattern = "CONTRIBUTING.md"
ownership = "pliego"

[[path]]
pattern = "docs/pliego/**"
ownership = "pliego"

[[path]]
pattern = "ports/pliego/**"
ownership = "pliego"

[[path]]
pattern = "tests/pliego/**"
ownership = "pliego"

[[path]]
pattern = "Cargo.toml"
ownership = "shared"

[[path]]
pattern = "Cargo.lock"
ownership = "shared"

[[path]]
pattern = "ports/servoshell/**"
ownership = "shared"

[[path]]
pattern = "etc/about.hbs"
ownership = "shared"

[[path]]
pattern = "python/servo/package_commands.py"
ownership = "shared"

[[path]]
pattern = "resources/resource_protocol/license.html"
ownership = "shared"

[[path]]
pattern = "tools/ownership-report/**"
ownership = "pliego"

[[path]]
pattern = "ownership.toml"
ownership = "pliego"
